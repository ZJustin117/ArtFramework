# D1 acceptance: default-off per-instance transient-effect claim is self-asserting through the
# read-only backend.renderPlan.aura.{gate,ready,draws} probe slice (the same nested map is also
# exposed as backend.renderPlan.vfxClaim; the seam is family-neutral, current members are the
# vfx-stance-aura FQNs plus the cross-family vfx-scene-world LightFlareSEffect/LightFlareMEffect/
# LightFlareLEffect/TorchParticleLEffect/TorchParticleXLEffect/CeilingDustCloudEffect, the
# vfx-misc-root
# FireBurstParticleEffect/NemesisFireParticle/GhostlyWeakFireEffect/GenericSmokeEffect/
# ExhaustBlurEffect, the vfx-combat
# FlashAtkImgEffect/RedFireBurstParticleEffect/SmokeBlurEffect, and the two bare-Texture
# ShieldParticleEffect/DebuffParticleEffect). Gate-OFF is
# native-authoritative; gate-ON delegates the supported FQNs to ART
# with draw evidence and no double-draw.
#
# NOTE: backend.renderPlan.aura.draws is a process-static LIFETIME counter (never reset outside
# tests), and nativeRender.delegatedWithoutEvidence / orphanArtOutput are lifetime-global too.
# The phases therefore assert captured BASELINES and DELTAS (eq_var / gt_var), never absolute
# values, so the scenario is session-robust. Each assert/capture is preceded by a fresh probe.
name: d1_aura_claim
schemaVersion: 1
mode: device
device: d1
require:
  env:
    - ART_D1_SERIAL
    - STS_CONNECTOR_PORT
    - SLAY_THE_AMETHYST_ROOT
steps:
  - console: "art lab ensure-fresh-menu"
  - wait_probe:
      timeout_ms: 45000
      interval_ms: 500
      assert:
        path: lab.recipe.status
        eq: ok
  - console: "art lab start-run IRONCLAD"
  - wait_probe:
      timeout_ms: 45000
      interval_ms: 500
      assert:
        path: lab.recipe.status
        eq: ok
  - wait_probe:
      timeout_ms: 30000
      interval_ms: 500
      assert:
        path: lab.runReady
        eq: true
  - console: "fight Cultist"
  - wait_probe:
      timeout_ms: 30000
      interval_ms: 1000
      assert:
        path: lab.inCombat
        eq: true
  # --- Gate-OFF phase: native stays authoritative; ART must not claim or draw. ---
  - console: "art aura off"
  - probe: all
  - capture:
      path: backend.renderPlan.aura.draws
      var: aura_draws_off_baseline
  - console: "art aura spawn wrath 6"
  - console: "art aura spawn calm 4"
  - console: "art aura spawn divinitychange 4"
  - console: "art claim spawn flare 4"
  - console: "art claim spawn flareM 4"
  - console: "art claim spawn flareL 4"
  - console: "art claim spawn torch 4"
  - console: "art claim spawn flash 4"
  - console: "art claim spawn fire 4"
  - console: "art claim spawn redfire 4"
  - console: "art claim spawn smoke 4"
  - console: "art claim spawn dust 4"
  - console: "art claim spawn nemesis 4"
  - console: "art claim spawn shield 4"
  - console: "art claim spawn debuff 4"
  - console: "art claim spawn torchxl 4"
  - console: "art claim spawn ghostlyfire 4"
  - console: "art claim spawn genericsmoke 4"
  - console: "art claim spawn exhaustblur 4"
  - wait_probe:
      timeout_ms: 8000
      interval_ms: 200
      assert:
        path: backend.renderPlan.aura.gate
        eq: false
  - probe: all
  # OFF must add ZERO ART draws relative to the captured lifetime baseline.
  - assert:
      path: backend.renderPlan.aura.draws
      eq_var: aura_draws_off_baseline
  - screenshot: true
  - console: "art aura clear"
  # --- Gate-ON phase: the real renderer is ready and ART owns the claimed pixels. ---
  - console: "art aura on"
  - wait_probe:
      timeout_ms: 8000
      interval_ms: 200
      assert:
        path: backend.renderPlan.aura.ready
        gte: 1
  - probe: all
  - assert:
      path: backend.renderPlan.aura.gate
      eq: true
  - capture:
      path: backend.renderPlan.aura.draws
      var: aura_draws_on_baseline
  - capture:
      path: backend.renderPlan.nativeRender.delegatedWithoutEvidence
      var: dewe_before
  - capture:
      path: backend.renderPlan.nativeRender.orphanArtOutput
      var: orphan_before
  - console: "art aura spawn stance 4"
  - console: "art aura spawn wrath 6"
  - console: "art aura spawn divinity 4"
  - console: "art aura spawn calm 4"
  - console: "art aura spawn divinitychange 4"
  - console: "art claim spawn flare 4"
  - console: "art claim spawn flareM 4"
  - console: "art claim spawn flareL 4"
  - console: "art claim spawn torch 4"
  - console: "art claim spawn flash 4"
  - console: "art claim spawn fire 4"
  - console: "art claim spawn redfire 4"
  - console: "art claim spawn smoke 4"
  - console: "art claim spawn dust 4"
  - console: "art claim spawn nemesis 4"
  - console: "art claim spawn shield 4"
  - console: "art claim spawn debuff 4"
  - console: "art claim spawn torchxl 4"
  - console: "art claim spawn ghostlyfire 4"
  - console: "art claim spawn genericsmoke 4"
  - console: "art claim spawn exhaustblur 4"
  # STRICT increase over the ON baseline proves ART drew the spawned auras.
  - wait_probe:
      timeout_ms: 8000
      interval_ms: 150
      assert:
        path: backend.renderPlan.aura.draws
        gt_var: aura_draws_on_baseline
  - screenshot: true
  - wait_probe:
      timeout_ms: 8000
      interval_ms: 250
      assert:
        path: backend.renderPlan.nativeRenderStrict.accepted
        eq: true
  - probe: all
  - assert:
      path: backend.renderPlan.nativeRender.delegatedWithoutEvidence
      eq_var: dewe_before
  - probe: all
  - assert:
      path: backend.renderPlan.nativeRender.orphanArtOutput
      eq_var: orphan_before
  # --- Teardown: return native pixels to authoritative and drop queued effects. ---
  - console: "art aura clear"
  - console: "art aura off"
