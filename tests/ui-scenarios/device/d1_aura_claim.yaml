# D1 acceptance: default-off per-instance transient-effect claim is self-asserting through the
# read-only backend.renderPlan.aura.{gate,ready,draws} probe slice (the same nested map is also
# exposed as backend.renderPlan.vfxClaim; the seam is family-neutral, current members are the
# vfx-stance-aura FQNs plus the cross-family vfx-scene-world LightFlareSEffect/LightFlareMEffect/
# LightFlareLEffect/TorchParticleLEffect/TorchParticleXLEffect/CeilingDustCloudEffect, the
# vfx-misc-root
# FireBurstParticleEffect/NemesisFireParticle/GhostlyWeakFireEffect/GenericSmokeEffect/
# ExhaustBlurEffect, the vfx-combat
# FlashAtkImgEffect/RedFireBurstParticleEffect/SmokeBlurEffect, and the four bare-Texture
# ShieldParticleEffect/DebuffParticleEffect/IceShatterEffect/WebParticleEffect, the four newest
# EntangleEffect/BlockImpactLineEffect/UnknownParticleEffect (vfx-combat) and ExhaustPileParticle,
# plus the five newest vfx-combat FlameParticleEffect/LightningOrbActivateEffect/
# DamageImpactBlurEffect/DamageImpactLineEffect/DarkOrbPassiveEffect, the three newest
# WarningSignEffect/StunStarEffect/FallingDustEffect, the three newest LightningEffect/
# FlameBallParticleEffect/ShineLinesEffect, the three newest TorchParticleMEffect/
# TorchParticleSEffect/DustEffect, and the two newest bare-Texture members with per-instance flip
# flags LightningOrbPassiveEffect/GlowyFireEyesEffect, plus the two newest FlyingSpikeEffect
# (vfx-combat, additive center-packed) and ConeEffect (root, ambient center-packed with the
# originX=0f + scale*1.1f rule), plus the two newest guard members FallingIceEffect (vfx-combat,
# additive shape-C 96x96 fixed rect) and DamageHeartEffect (root, ambient center-packed) — the seam's
# first per-kind NATIVE DRAW GUARD kinds (their native render is guarded on waitTimer/delayTimer).
# The two newest are SpookyChestEffect (root, ambient center-packed with per-instance flipX+flipY
# mirror booleans) and IroncladVictoryFlameEffect (root, ambient center-packed with a per-instance
# flipX mirror boolean) — the img path's first per-instance MIRROR kinds, whose mirror is reproduced
# as a UV swap on the canonical F15d region (FlameParticleEffect also uses the mirror).
# The three newest are SpookierChestEffect (root, ambient center-packed with per-instance flipX+flipY
# mirror booleans), CampfireSleepScreenCoverEffect (vfx-campfire-rest; the first claimed member of
# that family, a per-instance ambient center-packed sprite with a NO-ARG constructor, also
# ambient center-packed with flipX+flipY mirror booleans), and DeathScreenFloatyEffect (root, ambient
# center-packed with no flip flags), all reusing the existing img branch with no new formula.
# The newest is WrathStanceChangeParticle (vfx-stance-aura) — the FIRST non-deterministic native
# effect claimed: additive center-packed, but its native render draws at the PLAYER HITBOX CENTER X +
# x, consumes two ordered MathUtils.random values for scaleX/scaleY (replayed by the seam to keep the
# global RNG stream identical), and is guarded by `if (delayTimer > 0f) return` (the generalized guard
# threshold; a spawned lab instance uses delayTimer 0f so the guard is satisfied and ART may draw).
# The newest is StanceChangeAbsorptionParticle (vfx-stance-aura) — the seam's FIRST MULTI-DRAW kind:
# additive, it draws the static ImageMaster.WOBBLY_ORB_VFX Texture TWICE with the same shape-C fixed
# rect (offset/origin 16f, size 32x32, src 0,0,32,32, rotation offset -200f) and consumes FOUR
# MathUtils.random values in order (two per pass), replayed by the seam to keep the global RNG stream
# identical (snapshot taken once, restored on any post-consumption fail-open). With it, both
# vfx-stance-aura non-deterministic paths (Wrath + Absorption) are claimed.
# The two newest are BottomFogEffect (vfx-scene-world; ambient center-packed reusing the F22 mirror
# with flipX+flipY and NO new rule) and GiantFireEffect (vfx-combat; additive center-packed with a
# per-instance flipX mirror and a NEW pure uniform-scale rule: both axes are scale * Settings.scale).
# The newest (F29) is TorchHeadFireEffect (root; additive shape-C reusing the GlowyFireEyes fixed
# rect — offset/origin 64, size 128x128, src 0,0,128,128, rotation hardcoded 0f — with the effect's
# own flippedX horizontal flip and ONE new pure rule: an ASYMMETRIC X scale scaleX = scale * 1.2f,
# scaleY = scale).
# The newest (F30) is CardTrailEffect (root; additive img/AtlasRegion path with a new fixed-origin/
# size rule — origin 6,6 and size 12x12 INDEPENDENT of the region's packed size, rotation hardcoded
# 0f; static img, NO-ARG ctor).
# The newest (NRO-04 B01) is FlyingOrbEffect (vfx-combat; the seam's FIRST VARIABLE-LENGTH MULTI-DRAW
# kind — additive, one center-packed sprite per non-null points[index] for index from points.length-1
# down to 1, uniform scale starting at Settings.scale*1.5f decaying by 0.975f per drawn point; the
# native POSITION offset uses INTEGER division of the packed size while the ORIGIN uses FLOAT
# division (a 0.5px difference for the odd 81x81 GLOW_SPARK_2); NO
# x/y/scale field; guarded by `if (isDone) return`). The (float,float) ctor allocates
# points = new Vector2[60] (a length-60 array of nulls) that update() fills, so a freshly spawned
# instance draws nothing until update() runs; this spawn is for observation/lifecycle, NOT a per-kind
# draw assertion.
# NOTE: a freshly lab-spawned FallingIceEffect/DamageHeartEffect starts with its guard UNSATISFIED
# (waitTimer/delayTimer >= 0f), so the spawn-frame evidence for these two is the per-FQN
# active/entity delta on spawn (observation), NOT a draw increase at spawn. The kinds then diverge:
# FallingIceEffect.update() decrements waitTimer unconditionally, so once the wait elapses its guard
# becomes SATISFIED and ART CAN draw it (a draw increase may appear); DamageHeartEffect.delayTimer is
# the ctor arg (0f) and never decremented past its `> 0` branch, so it STAYS guarded.
# Gate-OFF is
# native-authoritative; gate-ON delegates the supported FQNs to ART
# with draw evidence and no double-draw.
#
# NOTE: backend.renderPlan.aura.draws is a process-static LIFETIME counter (never reset outside
# tests), and nativeRender.orphanArtOutput is likewise a lifetime-global leak counter. Those are
# asserted against captured BASELINES (eq_var / gt_var for draws, eq_var orphan_before for orphans),
# never absolute values, so the scenario is session-robust.
#
# nativeRender.delegatedWithoutEvidence is deliberately NOT treated as a lifetime invariant: it is
# the transient gauge openDelegatedGapCount + terminalMissingEvidenceCount, and the open-gap
# component oscillates 0<->1 between cross-thread probe samples, so a captured baseline can land on
# a transient 1 and a later read on 0. It is therefore asserted only as a bounded gauge
# (lte: 1, benign at 0/1); the real strictness guarantee is carried by
# nativeRenderStrict.accepted eq true together with zero leaked/unknown/rejected evidence.
# Each assert/capture is preceded by a fresh probe.
name: d1_aura_claim
schemaVersion: 1
mode: device
device: d1
require:
  env:
    - ART_D1_SERIAL
    - STS_CONNECTOR_PORT
    - SLAY_THE_AMETHYST_ROOT
steps:
  - console: "art lab ensure-fresh-menu"
  - wait_probe:
      timeout_ms: 45000
      interval_ms: 500
      assert:
        path: lab.recipe.status
        eq: ok
  - console: "art lab start-run IRONCLAD"
  - wait_probe:
      timeout_ms: 45000
      interval_ms: 500
      assert:
        path: lab.recipe.status
        eq: ok
  - wait_probe:
      timeout_ms: 30000
      interval_ms: 500
      assert:
        path: lab.runReady
        eq: true
  - console: "fight Cultist"
  - wait_probe:
      timeout_ms: 30000
      interval_ms: 1000
      assert:
        path: lab.inCombat
        eq: true
  # --- Gate-OFF phase: native stays authoritative; ART must not claim or draw. ---
  - console: "art aura off"
  - probe: all
  - capture:
      path: backend.renderPlan.aura.draws
      var: aura_draws_off_baseline
  - console: "art aura spawn wrath 6"
  - console: "art aura spawn calm 4"
  - console: "art aura spawn divinitychange 4"
  - console: "art claim spawn flare 4"
  - console: "art claim spawn flareM 4"
  - console: "art claim spawn flareL 4"
  - console: "art claim spawn torch 4"
  - console: "art claim spawn flash 4"
  - console: "art claim spawn fire 4"
  - console: "art claim spawn redfire 4"
  - console: "art claim spawn smoke 4"
  - console: "art claim spawn dust 4"
  - console: "art claim spawn nemesis 4"
  - console: "art claim spawn shield 4"
  - console: "art claim spawn debuff 4"
  - console: "art claim spawn torchxl 4"
  - console: "art claim spawn ghostlyfire 4"
  - console: "art claim spawn genericsmoke 4"
  - console: "art claim spawn exhaustblur 4"
  - console: "art claim spawn iceshatter 4"
  - console: "art claim spawn web 4"
  - console: "art claim spawn entangle 4"
  - console: "art claim spawn blockline 4"
  - console: "art claim spawn exhaustpile 4"
  - console: "art claim spawn unknown 4"
  - console: "art claim spawn flame 4"
  - console: "art claim spawn lightningorb 4"
  - console: "art claim spawn damageblur 4"
  - console: "art claim spawn damageline 4"
  - console: "art claim spawn darkorb 4"
  - console: "art claim spawn warning 4"
  - console: "art claim spawn stunstar 4"
  - console: "art claim spawn fallingdust 4"
  - console: "art claim spawn lightning 4"
  - console: "art claim spawn flameball 4"
  - console: "art claim spawn shinelines 4"
  - console: "art claim spawn torchm 4"
  - console: "art claim spawn torchs 4"
  - console: "art claim spawn scenedust 4"
  - console: "art claim spawn lop 4"
  - console: "art claim spawn glowyeyes 4"
  - console: "art claim spawn flyingspike 4"
  - console: "art claim spawn cone 4"
  - console: "art claim spawn fallingice 4"
  - console: "art claim spawn damageheart 4"
  - console: "art claim spawn spookychest 4"
  - console: "art claim spawn victoryflame 4"
  - console: "art claim spawn spookierchest 4"
  - console: "art claim spawn campfiresleepcover 4"
  - console: "art claim spawn deathfloaty 4"
  - console: "art claim spawn wrathchange 4"
  - console: "art claim spawn absorption 4"
  - console: "art claim spawn watersplash 4"
  - console: "art claim spawn buffparticle 4"
  - console: "art claim spawn bottomfog 4"
  - console: "art claim spawn giantfire 4"
  - console: "art claim spawn torchheadfire 4"
  - console: "art claim spawn cardtrail 4"
  - console: "art claim spawn flyingorb 4"
  - wait_probe:
      timeout_ms: 8000
      interval_ms: 200
      assert:
        path: backend.renderPlan.aura.gate
        eq: false
  - probe: all
  # OFF must add ZERO ART draws relative to the captured lifetime baseline.
  - assert:
      path: backend.renderPlan.aura.draws
      eq_var: aura_draws_off_baseline
  - screenshot: true
  - console: "art aura clear"
  # --- Gate-ON phase: the real renderer is ready and ART owns the claimed pixels. ---
  - console: "art aura on"
  - wait_probe:
      timeout_ms: 8000
      interval_ms: 200
      assert:
        path: backend.renderPlan.aura.ready
        gte: 1
  - probe: all
  - assert:
      path: backend.renderPlan.aura.gate
      eq: true
  - capture:
      path: backend.renderPlan.aura.draws
      var: aura_draws_on_baseline
  - capture:
      path: backend.renderPlan.nativeRender.orphanArtOutput
      var: orphan_before
  - console: "art aura spawn stance 4"
  - console: "art aura spawn wrath 6"
  - console: "art aura spawn divinity 4"
  - console: "art aura spawn calm 4"
  - console: "art aura spawn divinitychange 4"
  - console: "art claim spawn flare 4"
  - console: "art claim spawn flareM 4"
  - console: "art claim spawn flareL 4"
  - console: "art claim spawn torch 4"
  - console: "art claim spawn flash 4"
  - console: "art claim spawn fire 4"
  - console: "art claim spawn redfire 4"
  - console: "art claim spawn smoke 4"
  - console: "art claim spawn dust 4"
  - console: "art claim spawn nemesis 4"
  - console: "art claim spawn shield 4"
  - console: "art claim spawn debuff 4"
  - console: "art claim spawn torchxl 4"
  - console: "art claim spawn ghostlyfire 4"
  - console: "art claim spawn genericsmoke 4"
  - console: "art claim spawn exhaustblur 4"
  - console: "art claim spawn iceshatter 4"
  - console: "art claim spawn web 4"
  - console: "art claim spawn entangle 4"
  - console: "art claim spawn blockline 4"
  - console: "art claim spawn exhaustpile 4"
  - console: "art claim spawn unknown 4"
  - console: "art claim spawn flame 4"
  - console: "art claim spawn lightningorb 4"
  - console: "art claim spawn damageblur 4"
  - console: "art claim spawn damageline 4"
  - console: "art claim spawn darkorb 4"
  - console: "art claim spawn warning 4"
  - console: "art claim spawn stunstar 4"
  - console: "art claim spawn fallingdust 4"
  - console: "art claim spawn lightning 4"
  - console: "art claim spawn flameball 4"
  - console: "art claim spawn shinelines 4"
  - console: "art claim spawn torchm 4"
  - console: "art claim spawn torchs 4"
  - console: "art claim spawn scenedust 4"
  - console: "art claim spawn lop 4"
  - console: "art claim spawn glowyeyes 4"
  - console: "art claim spawn flyingspike 4"
  - console: "art claim spawn cone 4"
  - console: "art claim spawn fallingice 4"
  - console: "art claim spawn damageheart 4"
  - console: "art claim spawn spookychest 4"
  - console: "art claim spawn victoryflame 4"
  - console: "art claim spawn spookierchest 4"
  - console: "art claim spawn campfiresleepcover 4"
  - console: "art claim spawn deathfloaty 4"
  - console: "art claim spawn wrathchange 4"
  - console: "art claim spawn absorption 4"
  - console: "art claim spawn watersplash 4"
  - console: "art claim spawn buffparticle 4"
  - console: "art claim spawn bottomfog 4"
  - console: "art claim spawn giantfire 4"
  - console: "art claim spawn torchheadfire 4"
  - console: "art claim spawn cardtrail 4"
  - console: "art claim spawn flyingorb 4"
  # STRICT increase over the ON baseline proves ART drew the spawned auras.
  - wait_probe:
      timeout_ms: 8000
      interval_ms: 150
      assert:
        path: backend.renderPlan.aura.draws
        gt_var: aura_draws_on_baseline
  - screenshot: true
  - wait_probe:
      timeout_ms: 8000
      interval_ms: 250
      assert:
        path: backend.renderPlan.nativeRenderStrict.accepted
        eq: true
  - probe: all
  # delegatedWithoutEvidence is a transient gauge (openDelegatedGapCount + terminalMissingEvidenceCount)
  # whose open-gap component oscillates 0<->1 between probe samples, so it must be bounded, not
  # lifetime-equal; nativeRenderStrict.accepted eq true (above) is the real strictness gate.
  - assert:
      path: backend.renderPlan.nativeRender.delegatedWithoutEvidence
      lte: 1
  - probe: all
  - assert:
      path: backend.renderPlan.nativeRender.orphanArtOutput
      eq_var: orphan_before
  # --- Teardown: return native pixels to authoritative and drop queued effects. ---
  - console: "art aura clear"
  - console: "art aura off"
