# D1: entity probe shape after cold start (slots may be empty until consumer attaches).
name: d1_entity_present_smoke
schemaVersion: 1
mode: device
device: d1
require:
  env:
    - ART_D1_SERIAL
    - STS_CONNECTOR_PORT
    - SLAY_THE_AMETHYST_ROOT
steps:
  - console: "art lab ensure-fresh-menu"
  - wait_ms: 5000
  - wait_probe:
      timeout_ms: 15000
      interval_ms: 1000
      assert:
        path: schemaVersion
        eq: 1
  - assert:
      path: entities.slotCount
      gte: 0
  - assert:
      path: backend.entityDraw.count
      gte: 0
