# D1: combat chrome FULL_READY for energy / intents / proceed (milestone 26).
name: d1_full_present_combat_chrome
schemaVersion: 1
mode: device
device: d1
require:
  env:
    - ART_D1_SERIAL
    - STS_CONNECTOR_PORT
    - SLAY_THE_AMETHYST_ROOT
steps:
  - console: "art lab ensure-fresh-menu"
  - wait_ms: 8000
  - console: "art lab start-run IRONCLAD"
  - wait_ms: 25000
  - console: "art present combat on"
  - console: "art present energy on"
  - console: "art present intents on"
  - console: "art present proceed on"
  - console: "fight Cultist"
  - wait_probe:
      timeout_ms: 30000
      interval_ms: 1000
      assert:
        path: projection.scene
        eq: combat
  - wait_probe:
      timeout_ms: 10000
      interval_ms: 500
      assert:
        path: backend.input.handState
        eq: FULL_READY
  - wait_probe:
      timeout_ms: 8000
      interval_ms: 500
      assert:
        path: backend.energyDraw.capability
        eq: FULL_READY
  - assert:
      path: backend.input.energyState
      eq: FULL_READY
  - assert:
      path: backend.energyDraw.presentLevel
      eq: FULL
  - assert:
      path: backend.intentDraw.capability
      eq: FULL_READY
  - assert:
      path: backend.proceedDraw.capability
      eq: FULL_READY
  - assert:
      path: backend.proceedDraw.presentLevel
      eq: FULL
  - console: "art present pile_draw on"
  - wait_probe:
      timeout_ms: 8000
      interval_ms: 500
      assert:
        path: backend.pileDraw.capability
        eq: FULL_READY
  - assert:
      path: backend.pileDraw.presentLevel
      eq: FULL
  - assert:
      path: backend.pileDraw.suppressNativePileDraw
      eq: true
  - assert:
      path: backend.renderPlan
      exists: true
  - console: "art present pile_draw off"
  - wait_probe:
      timeout_ms: 8000
      interval_ms: 500
      assert:
        path: backend.fullPresent.pileDraw
        eq: "OFF"
  # Top panel (NRO-04 D02): full-present surface suppresses native TopPanel.render wholesale,
  # so the settings gear must be re-supplied as an ART pixel item. Deck/map remain uncovered.
  - console: "art present top on"
  - wait_probe:
      timeout_ms: 8000
      interval_ms: 500
      assert:
        path: backend.topPanelDraw.capability
        eq: FULL_READY
  - assert:
      path: backend.topPanelDraw.presentLevel
      eq: FULL
  - assert:
      path: backend.topPanelDraw.suppressNativeTopPanel
      eq: true
  - assert:
      path: backend.topPanelDraw.count
      gte: 7
  # Deterministic append order: bar, hp, gold, floor, ascension, status, settings.
  - assert:
      path: backend.topPanelDraw.items[6].id
      eq: top_panel.settings
  - assert:
      path: backend.topPanelDraw.items[6].resourceId
      eq: ui.top_panel.settings
  - console: "art present top off"
  - wait_probe:
      timeout_ms: 8000
      interval_ms: 500
      assert:
        path: backend.fullPresent.topPanel
        eq: "OFF"
