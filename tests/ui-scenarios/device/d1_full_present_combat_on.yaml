# Device: start-run reaches combat; FULL request owns the ready hand surface.
name: d1_full_present_combat_on
schemaVersion: 1
mode: device
device: d1
require:
  env:
    - ART_D1_SERIAL
    - STS_CONNECTOR_PORT
    - SLAY_THE_AMETHYST_ROOT
steps:
  - console: "art lab start-run IRONCLAD"
  - wait_probe:
      timeout_ms: 45000
      interval_ms: 500
      assert:
        path: lab.recipe.status
        eq: ok
  - wait_probe:
      timeout_ms: 30000
      interval_ms: 500
      assert:
        path: lab.runReady
        eq: true
  - console: "art present combat on"
  - wait_ms: 1000
  - console: "art frame"
  - wait_ms: 600
  - console: "art present status"
  - wait_ms: 400
  - probe: all
  - assert:
      path: schemaVersion
      eq: 1
  - assert:
      path: modId
      eq: artframework
  - assert:
      path: backend.id
      eq: signals
  - assert:
      path: backend.fullPresent.combatHand
      eq: "FULL"
  - assert:
      path: backend.fullPresent.combatHandFull
      eq: true
  - assert:
      path: backend.fullPresent.maySuppressNativeHand
      eq: true
  - assert:
      path: backend.input.handOwnsInput
      eq: true
  - assert:
      path: backend.input.handState
      eq: "FULL_READY"
  - assert:
      path: backend.renderPlan
      exists: true
  - assert:
      path: backend.controlsDraw
      exists: true
