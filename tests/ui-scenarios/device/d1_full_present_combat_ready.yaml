# D1: BaseMod fight provision reaches combat, then ART owns the mounted hand/controls/energy surfaces.
name: d1_full_present_combat_ready
schemaVersion: 1
mode: device
device: d1
require:
  env:
    - ART_D1_SERIAL
    - STS_CONNECTOR_PORT
    - SLAY_THE_AMETHYST_ROOT
steps:
  - console: "art lab ensure-fresh-menu"
  - wait_probe:
      timeout_ms: 45000
      interval_ms: 500
      assert:
        path: lab.recipe.status
        eq: ok
  - console: "art lab start-run IRONCLAD"
  - wait_probe:
      timeout_ms: 45000
      interval_ms: 500
      assert:
        path: lab.recipe.status
        eq: ok
  # Player assignment can precede the completed embark fade; fight only from a live dungeon.
  - wait_probe:
      timeout_ms: 30000
      interval_ms: 500
      assert:
        path: lab.runReady
        eq: true
  # Arm FULL before transition so the first combat hand frame is ART-owned.
  - console: "art present combat on"
  - console: "fight Cultist"
  - wait_probe:
      timeout_ms: 30000
      interval_ms: 1000
      assert:
        path: projection.scene
        eq: combat
  - wait_probe:
      timeout_ms: 10000
      interval_ms: 500
      assert:
        path: backend.input.handState
        eq: FULL_READY
  - wait_probe:
      timeout_ms: 5000
      interval_ms: 250
      assert:
        path: backend.handDraw.count
        gte: 1
  - assert:
      path: backend.fullPresent.maySuppressNativeHand
      eq: true
  - assert:
      path: backend.input.handOwnsInput
      eq: true
  - assert:
      path: backend.renderPlan.drawCount
      gte: 4
  # C2 full-present now owns end-turn button pixels; native EndTurnButton.render is suppressed at FULL.
  - assert:
      path: backend.controlsDraw.suppressNativeEndTurn
      eq: true
  - wait_probe:
      timeout_ms: 5000
      interval_ms: 250
      assert:
        path: backend.handRender.ok
        eq: true
  # Energy rendering must establish a resident texture before lifecycle baselines are captured.
  - wait_probe:
      timeout_ms: 10000
      interval_ms: 250
      assert:
        path: backend.materializer.residentCount
        gte: 1
  - capture:
      path: backend.materializer.putCount
      var: materializer_put_before_recreate
  # disposeCount records disposal attempts, not successful GL disposal.
  - capture:
      path: backend.materializer.disposeCount
      var: materializer_dispose_attempts_before_recreate
  - capture:
      path: backend.materializer.hitCount
      var: materializer_hit_before_recreate
  - console: "art lab host-recreate"
  # Admission is asynchronous; cleared is the terminal successful materializer state.
  - wait_probe:
      timeout_ms: 10000
      interval_ms: 500
      assert:
        path: backend.safety.materializerRecreation
        eq: cleared
  - wait_probe:
      timeout_ms: 10000
      interval_ms: 250
      assert:
        path: backend.materializer.disposeCount
        gt_var: materializer_dispose_attempts_before_recreate
  - wait_probe:
      timeout_ms: 10000
      interval_ms: 250
      assert:
        path: backend.materializer.putCount
        gt_var: materializer_put_before_recreate
  - wait_probe:
      timeout_ms: 10000
      interval_ms: 250
      assert:
        path: backend.materializer.residentCount
        gte: 1
  # Capture again after rematerialization so only later render-frame cache hits satisfy reuse.
  - capture:
      path: backend.materializer.hitCount
      var: materializer_hit_after_rematerialize
  - wait_probe:
      timeout_ms: 10000
      interval_ms: 250
      assert:
        path: backend.materializer.hitCount
        gt_var: materializer_hit_after_rematerialize
  # Materializer lifecycle success must not hide a strict FULL-present gap.
  - wait_probe:
      timeout_ms: 10000
      interval_ms: 250
      assert:
        path: backend.renderPlan.nativeRenderStrict.accepted
        eq: true
  - assert:
      path: backend.renderPlan.nativeRenderStrict.openInvocation
      eq: 0
  - assert:
      path: backend.renderPlan.nativeRenderStrict.delegatedWithoutEvidence
      eq: 0
  - assert:
      path: backend.renderPlan.nativeRenderStrict.orphanArtOutput
      eq: 0
