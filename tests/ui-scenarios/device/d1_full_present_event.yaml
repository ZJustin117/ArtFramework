# D1: Neow/event room — ART owns event surface (FULL_READY + eventDraw).
name: d1_full_present_event
schemaVersion: 1
mode: device
device: d1
require:
  env:
    - ART_D1_SERIAL
    - STS_CONNECTOR_PORT
    - SLAY_THE_AMETHYST_ROOT
steps:
  - console: "art lab ensure-fresh-menu"
  - wait_ms: 8000
  - console: "art lab start-run IRONCLAD"
  - wait_probe:
      timeout_ms: 45000
      interval_ms: 500
      assert:
        path: lab.recipe.status
        eq: ok
  # Player assignment can precede the completed embark fade; only continue from a live dungeon.
  - wait_probe:
      timeout_ms: 30000
      interval_ms: 500
      assert:
        path: lab.runReady
        eq: true
  # Stay on the Neow event that the run opens into (an AbstractEvent using GenericEventDialog);
  # do NOT advance past it. The lab's `art lab enter-event` path injects a fresh EventRoom and
  # crashes the render thread (AbstractDungeon.render NPE), and the map-navigation intent is not
  # wired, so the reliable real-event entry is the run's opening Neow event.
  # Observe first so StageHost publishes backend frames without suppressing native event UI.
  - console: "art present event observe"
  - wait_probe:
      timeout_ms: 30000
      interval_ms: 500
      assert:
        path: projection.scene
        eq: event
  - console: "art present event on"
  - wait_probe:
      timeout_ms: 30000
      interval_ms: 500
      assert:
        path: backend.input.eventState
        eq: FULL_READY
  - assert:
      path: backend.fullPresent.event
      eq: FULL
  - assert:
      path: backend.eventDraw.suppressNativeEvent
      eq: true
  - wait_probe:
      timeout_ms: 10000
      interval_ms: 500
      assert:
        path: backend.eventDraw.count
        gte: 1
  # NRO-04 D06: the event PANEL now uses native GenericEventDialog.render geometry
  # (center WIDTH/2-881.5-12*xScale+881.5*xScale, EVENT_Y-403-64*scale+403*scale;
  #  size 1763*xScale x 806*scale) instead of the generic centered rectangle.
  - assert:
      path: backend.eventDraw.panelCount
      gte: 1
  - assert:
      path: backend.eventDraw.panel.resourceId
      eq: "ui.event.panel"
  - assert:
      path: backend.eventDraw.panel.w
      gte: 1
  - assert:
      path: backend.eventDraw.panel.h
      gte: 1
