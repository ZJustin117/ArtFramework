# D1: open the active run map, let ART fully present it, then submit an ART map intent.
name: d1_full_present_map_ready
schemaVersion: 1
mode: device
device: d1
require:
  env:
    - ART_D1_SERIAL
    - STS_CONNECTOR_PORT
    - SLAY_THE_AMETHYST_ROOT
steps:
  - console: "art lab start-run IRONCLAD"
  - wait_probe:
      timeout_ms: 45000
      interval_ms: 500
      assert:
        path: lab.recipe.status
        eq: ok
  # Player assignment can precede the completed embark fade; only continue from a live dungeon.
  - wait_probe:
      timeout_ms: 30000
      interval_ms: 500
      assert:
        path: lab.runReady
        eq: true
  # Leave Neow/event so first-floor map nodes become selectable (room COMPLETE).
  - console: "art lab proceed"
  - wait_ms: 3000
  - console: "art lab proceed"
  - wait_ms: 3000
  # STS MapRoomNode first-pick requires currRoom.phase == COMPLETE.
  - console: "evalcode com.megacrit.cardcrawl.dungeons.AbstractDungeon.getCurrRoom().phase=com.megacrit.cardcrawl.rooms.AbstractRoom.RoomPhase.COMPLETE"
  # A pending lab room transition is not a legal target for ART's map bridge.
  - console: "evalcode com.megacrit.cardcrawl.dungeons.AbstractDungeon.nextRoom=null"
  - wait_ms: 500
  - console: "evalcode com.megacrit.cardcrawl.dungeons.AbstractDungeon.dungeonMapScreen.open(false)"
  # Mount first: StageHost publishes native frames while a present surface is active.
  - console: "art present map on"
  - wait_probe:
      timeout_ms: 20000
      interval_ms: 500
      assert:
        path: projection.available
        eq: true
  - wait_probe:
      timeout_ms: 20000
      interval_ms: 500
      assert:
        path: projection.scene
        eq: map
  - wait_probe:
      timeout_ms: 10000
      interval_ms: 500
      assert:
        path: backend.renderPlan.entries[0].effectiveState
        eq: FULL_READY
  - assert:
      path: backend.mapDraw.suppressNativeMap
      eq: true
  - assert:
      path: backend.mapDraw.count
      gte: 1
  - assert:
      path: backend.mapDraw.missingArt
      eq: 0
  # NRO-04 D03: the legend panel + 6 room-type rows must be supplied while the map is FULL_READY.
  # (The panel geometry depends on the live desktop Settings scale; the probe always reports it.)
  - wait_probe:
      timeout_ms: 10000
      interval_ms: 500
      assert:
        path: backend.mapDraw.legend.panel.resourceId
        eq: ui.map.legend
  - assert:
      path: backend.mapDraw.legendCount
      gte: 6
  # NRO-04 D03 follow-up: the legend text must be LOCALIZED from the native Legend UIStrings
  # (CardCrawlGame.languagePack.getUIString("Legend").TEXT[0/3/6/9/12/15] + TEXT[18]), not the
  # English fallback. Assert presence + at least one non-empty label; do NOT hardcode a language.
  - assert:
      path: backend.mapDraw.legendTitle
      exists: true
  - assert:
      path: backend.mapDraw.legendLabels
      exists: true
  - assert:
      path: backend.mapDraw.legendLabels[0]
      neq: ""
  - capture:
      path: backend.mapDraw.legendTitle
      var: legend_resolved_title
  - capture:
      path: backend.mapDraw.legendLabels[0]
      var: legend_resolved_label_0
  # The resolved text must reach the per-item drawables too (legend.items[0] is the title row,
  # legend.items[1] the first room row), not merely the probe arrays.
  - assert:
      path: backend.mapDraw.legend.items[0].label
      eq_var: legend_resolved_title
  - assert:
      path: backend.mapDraw.legend.items[1].label
      eq_var: legend_resolved_label_0
  # NRO-04 D03 defect fix: the map surface must actually SUBMIT the mapped pixels (node icon +
  # conditional outline/overlay, plus legend panel/title/icons), not only count them. submitCount
  # is the renderMap submission-plan size; it must exceed the projected node + legend counts alone.
  - wait_probe:
      timeout_ms: 10000
      interval_ms: 500
      assert:
        path: backend.mapDraw.submitCount
        gte: 1
  # NRO-04 D03: node/outline tint fidelity. The resolved colors must equal the VERIFIED native
  # MapRoomNode constants (AVAILABLE=0.09,0.13,0.17 -> 17212bff; NOT_TAKEN=0.34,0.34,0.34 ->
  # 575757ff; OUTLINE=8c8c80ff; highlight=(0.9,0.9,0.9,1) -> e6e6e6ff), derived from the state
  # predicates, so nodes are no longer submitted at white.
  - assert:
      path: backend.mapDraw.colorSamples.takenColorHex
      eq: "17212bff"
  - assert:
      path: backend.mapDraw.colorSamples.availableColorHex
      eq: "17212bff"
  - assert:
      path: backend.mapDraw.colorSamples.untakenColorHex
      eq: "575757ff"
  - assert:
      path: backend.mapDraw.colorSamples.outlineColorHex
      eq: "8c8c80ff"
  - assert:
      path: backend.mapDraw.colorSamples.highlightColorHex
      eq: "e6e6e6ff"
  # Each projected node must carry a resolved native tint that is NOT white. The color rule
  # (taken || available -> 0.09/0.13/0.17, else 0.34/0.34/0.34) never yields r=g=b=1.0, so a
  # deterministic node cannot be white; the component assert proves non-white rather than presence.
  - assert:
      path: backend.mapDraw.items[0].color
      exists: true
  - assert:
      path: backend.mapDraw.items[0].color.r
      neq: 1.0
  - assert:
      path: backend.mapDraw.items[0].colorHex
      neq: "ffffffff"
  # Pick leftmost presentable floor-0 node (skips offscreen column placeholders).
  - console: "art op map first"
  - wait_probe:
      timeout_ms: 30000
      interval_ms: 500
      assert:
        path: projection.scene
        neq: map
