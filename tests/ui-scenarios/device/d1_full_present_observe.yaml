# Device: after start-run, enable combat OBSERVE and assert probe policy (no native suppress).
# Prerequisites: READY, ArtFramework enabled, preferably in combat (or after lab start-run).
name: d1_full_present_observe
schemaVersion: 1
mode: device
device: d1
require:
  env:
    - ART_D1_SERIAL
    - STS_CONNECTOR_PORT
    - SLAY_THE_AMETHYST_ROOT
steps:
  - console: "art lab ensure-fresh-menu"
  - wait_ms: 8000
  - console: "art lab start-run IRONCLAD"
  - wait_ms: 25000
  - console: "art present combat observe"
  - wait_ms: 800
  - console: "art frame"
  - wait_ms: 500
  - console: "art present status"
  - wait_ms: 400
  - probe: all
  - assert:
      path: schemaVersion
      eq: 1
  - assert:
      path: backend.id
      eq: signals
  - assert:
      path: backend.fullPresent.combatHand
      eq: "OBSERVE"
  - assert:
      path: backend.fullPresent.combatHandFull
      eq: false
  - assert:
      path: backend.fullPresent.maySuppressNativeHand
      eq: false
