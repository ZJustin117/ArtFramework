# D1: enter a rest room through native map navigation and verify ART room chrome.
name: d1_full_present_rest
schemaVersion: 1
mode: device
device: d1
require:
  env:
    - ART_D1_SERIAL
    - STS_CONNECTOR_PORT
    - SLAY_THE_AMETHYST_ROOT
steps:
  - console: "art lab ensure-fresh-menu"
  - wait_ms: 8000
  - console: "art lab start-run IRONCLAD"
  - wait_ms: 20000
  - wait_probe:
      timeout_ms: 45000
      interval_ms: 500
      assert:
        path: lab.runReady
        eq: true
  - console: "art lab proceed"
  - wait_ms: 3000
  - console: "art lab proceed"
  - wait_ms: 3000
  - console: "art present rest on"
  - console: "art lab enter-room rest"
  - wait_probe:
      timeout_ms: 30000
      interval_ms: 500
      assert:
        path: projection.scene
        eq: rest
  - assert:
      path: backend.fullPresent.rest
      eq: FULL
  - assert:
      path: backend.restDraw.suppressNativeRest
      eq: true
  - assert:
      path: backend.restDraw.count
      gte: 1
  # NRO-04 D07: campfire option buttons use the native CampfireUI grid geometry. The probe
  # exposes native button bounds (at-rest icon 256*0.9*scale, centered on native positions); these
  # assertions only check PRESENCE and POSITIVE size, not exact native values.
  - assert:
      path: backend.restDraw.buttonCount
      gte: 1
  - assert:
      path: backend.restDraw.buttons[0].w
      gte: 1
  - assert:
      path: backend.restDraw.buttons[0].h
      gte: 1
  # NRO-04 D07 follow-up: native CampfireUI.render draws NO campfire site title, so ART emits none.
  - assert:
      path: backend.restDraw.hasTitle
      falsey: true
  # NRO-04 D07 follow-up: the option label is anchored BELOW the icon center per native
  # AbstractCampfireOption.render (renderFontCenteredTopAligned at hb.cY - 105f*scale), so
  # labelAnchorY < centerY. `lt` is unsupported, so capture the anchor and assert centerY > it.
  - capture:
      path: backend.restDraw.buttons[0].labelAnchorY
      var: labelAnchorY0
  - assert:
      path: backend.restDraw.buttons[0].centerY
      gt_var: labelAnchorY0
  - assert:
      path: backend.restDraw.buttons[0].labelAnchorX
      gte: 1
