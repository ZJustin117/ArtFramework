# D1: reward FULL policy + mount; capability field always present (26).
# FULL_READY only when projection.scene is reward (JUnit owns that matrix).
name: d1_full_present_reward
schemaVersion: 1
mode: device
device: d1
require:
  env:
    - ART_D1_SERIAL
    - STS_CONNECTOR_PORT
    - SLAY_THE_AMETHYST_ROOT
steps:
  - console: "art lab ensure-fresh-menu"
  - wait_ms: 8000
  - console: "art lab start-run IRONCLAD"
  - wait_ms: 20000
  - console: "art present reward on"
  - wait_probe:
      timeout_ms: 15000
      interval_ms: 1000
      assert:
        path: backend.fullPresent.reward
        eq: FULL
  - assert:
      path: backend.rewardDraw.presentLevel
      eq: FULL
  - assert:
      path: backend.rewardDraw.capability
      exists: true
  - assert:
      path: backend.input.rewardState
      exists: true
  - assert:
      path: backend.rewardDraw.suppressNativeReward
      exists: true
  # NRO-04 D04: the reward surface must supply the whole-screen sheet/panel pixels that the
  # wholesale suppression removes (native CombatRewardScreen.renderItemReward REWARD_SCREEN_SHEET).
  - assert:
      path: backend.rewardDraw.sheet.resourceId
      eq: ui.reward.sheet
  - assert:
      path: backend.rewardDraw.sheetCount
      gte: 1
  - assert:
      path: backend.rewardDraw.submitCount
      gte: 1
