# D1: open a native grid and hand select screen from real run cards.
name: d1_full_present_select
schemaVersion: 1
mode: device
device: d1
require:
  env:
    - ART_D1_SERIAL
    - STS_CONNECTOR_PORT
    - SLAY_THE_AMETHYST_ROOT
steps:
  - console: "art lab ensure-fresh-menu"
  - wait_ms: 8000
  - console: "art lab start-run IRONCLAD"
  - wait_ms: 20000
  - wait_probe:
      timeout_ms: 45000
      interval_ms: 500
      assert:
        path: lab.runReady
        eq: true
  - console: "art lab proceed"
  - wait_ms: 3000
  - console: "art lab proceed"
  - wait_ms: 3000
  - console: "art present select on"
  - console: "fight Cultist"
  - wait_probe:
      timeout_ms: 30000
      interval_ms: 500
      assert:
        path: projection.scene
        eq: combat
  - console: "art lab enter-select grid"
  - wait_probe:
      timeout_ms: 15000
      interval_ms: 500
      assert:
        path: projection.scene
        eq: select
  - assert:
      path: backend.fullPresent.select
      eq: FULL
  - assert:
      path: backend.selectDraw.suppressNativeSelect
      eq: true
  - assert:
      path: backend.selectDraw.count
      gte: 1
  - assert:
      path: backend.selectDraw.confirm.resourceId
      eq: ui.select.confirm
  - assert:
      path: backend.selectDraw.confirm.w
      gte: 1
  # D09 follow-up: the confirm label is the LIVE native button text
  # (`CardSelectConfirmButton.buttonText` / `GridSelectConfirmButton.buttonText`), so on a Chinese
  # device it is localized (e.g. 确认) and must NOT equal the English fallback literal "Confirm"
  # (that literal is only ART's fallback when the native label is unavailable). Do not hardcode a
  # language: assert presence, non-empty, and that the fallback was not used.
  - assert:
      path: backend.selectDraw.confirm.label
      exists: true
  - assert:
      path: backend.selectDraw.confirm.label
      neq: ""
  - assert:
      path: backend.selectDraw.confirm.label
      neq: "Confirm"
  - capture:
      path: backend.selectDraw.confirm.label
      var: select_confirm_label
  # D09: card labels use the localized AbstractCard.name (CardView.title), not the raw card id.
  # The projection already carries the localized title; assert the label probe data exists and is
  # non-empty (raw-id fallback only applies when a title is genuinely absent). NOTE (U06): the DRAWN
  # card text now comes from `item.title` at the native renderTitle anchor - `item.label` is probe
  # data, and for a blank title `item.titleDrawable` is false so nothing is drawn.
  - assert:
      path: backend.selectDraw.items[0].cardId
      exists: true
  - assert:
      path: backend.selectDraw.items[0].label
      exists: true
  - assert:
      path: backend.selectDraw.items[0].label
      neq: ""
  # U02c: for a non-confirm card the accounting is decided by the type/color-derived base-background
  # frame descriptor ALONE (accounting option (b)). The primary `ui.select.card` / `_SELECTED` handle
  # maps to the non-file-backed `cardui/frame` key but is NOT a separate drawn texture: native
  # `Sts1SurfaceRenderer.renderSelect` draws exactly one base bg per card - the derived
  # `cardui#512/bg_<type>_<color>` region - and the primary draw is a no-op, so requiring the primary
  # double-counted that same native draw. Every visible run card's base region resolves on device and
  # the confirm pseudo-item is file-backed, so the Ironclad starting grid (11 cards + 1 confirm,
  # count 12) has NO gap: missingArt drops from the previous 11 to 0. `missingArt` still counts
  # visible items with at least one unresolved required resource (blank/unknown-type frames stay
  # gaps), so `lte: 0` pins the honest new value without pretending the accounting is tautological.
  - assert:
      path: backend.selectDraw.missingArt
      lte: 0
  # materializedResolved counts only visible items whose required resources all resolve. With the gap
  # closed, every visible item is fully materialized, so the visible count now EQUALS it (it no longer
  # strictly exceeds it).
  - capture:
      path: backend.selectDraw.materializedResolved
      var: select_materialized_resolved
  - assert:
      path: backend.selectDraw.count
      eq_var: select_materialized_resolved
  # U02: the live `ImageMaster.cardUiAtlas` is now wired via `CardUiAtlasSource`, and each select
  # card item derives its base-background frame from the native card type/color as a real
  # `cardui#512/bg_<type>_<color>` 512-page region descriptor. The item therefore exposes the
  # resolved descriptor in `frameResourceId`. A real run card must map to a real region (not the
  # old non-file-backed `cardui/frame` default). `items[0]` is the starting Ascender's Bane, whose
  # native type AND color are both CURSE, so per `AbstractCard.renderCardBg` it renders the SKILL
  # family black page: `cardui#512/bg_skill_black`. These assertions target a real ATTACK card
  # (items[1], the first Strike).
  - assert:
      path: backend.selectDraw.items[1].frameResourceId
      exists: true
  - assert:
      path: backend.selectDraw.items[1].frameResourceId
      contains: "cardui#512/bg_"
  - assert:
      path: backend.selectDraw.items[1].frameResourceId
      neq: "cardui/frame"
  # items[0] (the CURSE Ascender's Bane) draws the native black SKILL background page, not a bogus
  # descriptor: CURSE type maps to the skill family and CURSE color to CARD_SKILL_BG_BLACK.
  - assert:
      path: backend.selectDraw.items[0].frameResourceId
      eq: "cardui#512/bg_skill_black"
  # U02d: the select card BANNER is a real 512-page region in the same live `ImageMaster.cardUiAtlas`
  # (`512/banner_<rarity>`), derived from the native `AbstractCard.rarity` per
  # `AbstractCard.renderBannerImage`: BASIC/COMMON/CURSE and the native default map to
  # CARD_BANNER_COMMON, UNCOMMON to CARD_BANNER_UNCOMMON, RARE to CARD_BANNER_RARE. Each non-confirm
  # item exposes the resolved descriptor in `bannerResourceId`. `items[1]` is the starting Ironclad
  # Strike, whose native rarity is BASIC, so it draws `cardui#512/banner_common`.
  - assert:
      path: backend.selectDraw.items[1].bannerResourceId
      exists: true
  - assert:
      path: backend.selectDraw.items[1].bannerResourceId
      contains: "cardui#512/banner_"
  - assert:
      path: backend.selectDraw.items[1].bannerResourceId
      eq: "cardui#512/banner_common"
  # items[0] (the CURSE Ascender's Bane) also uses the native common banner, not a bogus descriptor.
  - assert:
      path: backend.selectDraw.items[0].bannerResourceId
      eq: "cardui#512/banner_common"
  # U02d2: the select card ENERGY ORB is a real 512-page region in the same live
  # `ImageMaster.cardUiAtlas` (`512/card_<color>_orb`), drawn by native
  # `AbstractCard.renderEnergy` from `this.color` (COLORLESS/default -> `card_colorless_orb`). Each
  # non-confirm item exposes the descriptor in `orbResourceId`. `items[1]` is the starting Ironclad
  # Strike, whose native color is RED, so it draws `cardui#512/card_red_orb`.
  - assert:
      path: backend.selectDraw.items[1].orbResourceId
      exists: true
  - assert:
      path: backend.selectDraw.items[1].orbResourceId
      contains: "cardui#512/card_"
  - assert:
      path: backend.selectDraw.items[1].orbResourceId
      eq: "cardui#512/card_red_orb"
  # U02d3: native `AbstractCard.renderEnergy` also draws the ENERGY COST NUMBER after the orb, at
  # (-132*scale, 192*scale) with the large energy font scaled by the card draw scale. ART maps the
  # uniform select-card scale as factor = item.w/512 = 250/512 (the renderer's
  # `bounds.width / region.originalWidth` analogue), so the offsets are (-64.453125, 93.75). items[1]
  # is the starting Ironclad Strike: cost 1, not in hand and unmodified, so it draws the white "1" in
  # that slot. items[0] is the CURSE Ascender's Bane whose native cost is -2, so native renderEnergy
  # returns early and draws NEITHER orb NOR number (costDrawable false). The colour is deliberately
  # NOT asserted here: white/green/red depends on live in-hand/modified/restricted state, which this
  # starting-grid frame does not pin.
  - assert:
      path: backend.selectDraw.items[1].costDrawable
      eq: true
  - assert:
      path: backend.selectDraw.items[1].costText
      eq: "1"
  - assert:
      path: backend.selectDraw.items[1].costOffsetX
      exists: true
  - assert:
      path: backend.selectDraw.items[0].costDrawable
      eq: false
  # U04: the select card PORTRAIT is a real region on the native `cards/cards.atlas` page
  # (`AbstractCard.cardAtlas`). That page's region names ARE the native card art urls
  # (`AbstractCard.assetUrl`), the exact string native `AbstractCard` passes to
  # `cardAtlas.findRegion(assetUrl)`, and the item exposes `cards#<assetUrl>` in
  # `portraitResourceId` via `SelectDrawPath.portraitDescriptor`. `items[1]` is the starting Ironclad
  # Strike, whose native asset url is `red/attack/strike`. `items[0]` is the CURSE Ascender's Bane,
  # whose art url lives on the 2-segment curse page (`curse/ascenders_bane`) - a different native
  # asset path. Its EXACT url is deliberately NOT pinned here (it is a mod/localization-independent
  # native asset path this slice did not verify end-to-end on device), so only `items[1]` is exact.
  #
  # D1 is OFFLINE for this slice: this block is an UNRUN device assertion, and device evidence for
  # the portrait is PENDING (no device run was performed).
  - assert:
      path: backend.selectDraw.items[1].portraitResourceId
      exists: true
  - assert:
      path: backend.selectDraw.items[1].portraitResourceId
      contains: "cards#"
  - assert:
      path: backend.selectDraw.items[1].portraitResourceId
      eq: "cards#red/attack/strike"
  # U03: native rooms declare NO room-shell title (VERIFIED decompiled STS1 rooms/**: AbstractRoom
  # has no `title`/`roomID` field and draws no room title; EventRoom/NeowRoom delegate to the event
  # surface). On the select screen the live room is a plain combat MonsterRoom, so the backend
  # room-shell title must be EMPTY and the renderer must publish no label. This pins that the stray
  # non-native "Generic" label no longer draws over the world/select screens.
  - assert:
      path: backend.roomShellDraw.title
      eq: ""
  - assert:
      path: backend.roomShellDraw.frameHasTitle
      eq: false
