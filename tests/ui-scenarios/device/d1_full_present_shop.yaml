# D1: enter a shop room through native map navigation and verify ART room chrome.
name: d1_full_present_shop
schemaVersion: 1
mode: device
device: d1
require:
  env:
    - ART_D1_SERIAL
    - STS_CONNECTOR_PORT
    - SLAY_THE_AMETHYST_ROOT
steps:
  - console: "art lab ensure-fresh-menu"
  - wait_ms: 8000
  - console: "art lab start-run IRONCLAD"
  - wait_ms: 20000
  - wait_probe:
      timeout_ms: 45000
      interval_ms: 500
      assert:
        path: lab.runReady
        eq: true
  - console: "art lab proceed"
  - wait_ms: 3000
  - console: "art lab proceed"
  - wait_ms: 3000
  - console: "art present shop on"
  - console: "art lab enter-room shop"
  - wait_probe:
      timeout_ms: 30000
      interval_ms: 500
      assert:
        path: projection.scene
        eq: shop
  - assert:
      path: backend.fullPresent.shop
      eq: FULL
  - assert:
      path: backend.shopDraw.suppressNativeShop
      eq: true
  - assert:
      path: backend.shopDraw.count
      gte: 1
