# D1: enter a treasure room through native map navigation and verify ART room chrome.
name: d1_full_present_treasure
schemaVersion: 1
mode: device
device: d1
require:
  env:
    - ART_D1_SERIAL
    - STS_CONNECTOR_PORT
    - SLAY_THE_AMETHYST_ROOT
steps:
  - console: "art lab ensure-fresh-menu"
  - wait_ms: 8000
  - console: "art lab start-run IRONCLAD"
  - wait_ms: 20000
  - wait_probe:
      timeout_ms: 45000
      interval_ms: 500
      assert:
        path: lab.runReady
        eq: true
  - console: "art lab proceed"
  - wait_ms: 3000
  - console: "art lab proceed"
  - wait_ms: 3000
  - console: "art present treasure on"
  - console: "art lab enter-room treasure"
  - wait_probe:
      timeout_ms: 30000
      interval_ms: 500
      assert:
        path: projection.scene
        eq: treasure
  # NRO-04 D08: check the actual AbstractChest sprite IMMEDIATELY after the scene wait. The lab
  # treasure room auto-advances to the map, so a late probe is flaky; this minimizes the window.
  - wait_probe:
      timeout_ms: 30000
      interval_ms: 500
      assert:
        path: backend.treasureDraw.chestCount
        gte: 1
  - assert:
      path: backend.treasureDraw.chest.resourceId
      exists: true
  - assert:
      path: backend.treasureDraw.chest.resourceId
      contains: chest
  - assert:
      path: backend.fullPresent.treasure
      eq: FULL
  - assert:
      path: backend.treasureDraw.suppressNativeTreasure
      eq: true
  # NRO-04 D08 follow-up: verified native TreasureRoom.render draws NO "Treasure" title and NO
  # "Chest closed/opened" status text, so those synthetic rows were removed. The CLOSED state
  # projects ZERO chrome rows (chest sprite only); an opened chest projects at most the single
  # relic row. Assert the reduced count here (the chest geometry asserts above remain).
  - assert:
      path: backend.treasureDraw.chromeLineCount
      lte: 1
  - assert:
      path: backend.treasureDraw.drawCount
      lte: 1
