# Device: clear saves + strip resume toward a fresh main menu.
name: d1_lab_ensure_fresh_menu
schemaVersion: 1
mode: device
device: d1
require:
  env:
    - ART_D1_SERIAL
    - STS_CONNECTOR_PORT
    - SLAY_THE_AMETHYST_ROOT
steps:
  - console: "art lab ensure-fresh-menu"
  - wait_ms: 8000
  - console: "art lab status"
  - wait_ms: 400
  - console: "art lab dump"
  - wait_ms: 500
  - probe: all
  - assert:
      path: schemaVersion
      eq: 1
  - assert:
      path: modId
      eq: artframework
