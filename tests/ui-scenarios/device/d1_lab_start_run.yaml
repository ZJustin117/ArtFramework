# Device: fresh menu → char select → Ironclad → embark (may take several seconds).
# Prerequisites: READY main menu (android-device-lab.md). Optional seed for stability.
name: d1_lab_start_run
schemaVersion: 1
mode: device
device: d1
require:
  env:
    - ART_D1_SERIAL
    - STS_CONNECTOR_PORT
    - SLAY_THE_AMETHYST_ROOT
steps:
  - console: "art lab ensure-fresh-menu"
  - wait_ms: 8000
  - console: "art lab start-run IRONCLAD"
  - wait_ms: 20000
  - console: "art lab status"
  - wait_ms: 500
  - console: "art lab dump"
  - wait_ms: 800
  - console: "art frame"
  - wait_ms: 500
  - probe: all
  - assert:
      path: schemaVersion
      eq: 1
  - assert:
      path: modId
      eq: artframework
  - assert:
      path: backend.id
      eq: signals
