# D1: Lightwave C2 chrome and surface FX across the combat presentation path.
name: d1_lightwave_c2_full
schemaVersion: 1
mode: device
device: d1
require:
  env:
    - ART_D1_SERIAL
    - STS_CONNECTOR_PORT
    - SLAY_THE_AMETHYST_ROOT
steps:
  - console: "art lab ensure-fresh-menu"
  - wait_ms: 8000
  - console: "art profile set lightwave"
  - wait_ms: 400
  - probe: all
  - assert:
      path: presentProfile.active
      eq: lightwave
  - assert:
      path: presentPacks.active
      eq: lightwave
  - assert:
      path: presentPacks.apply.activePack
      eq: lightwave
  - assert:
      path: presentPacks.apply.managedFullFrame
      eq: true
  - assert:
      path: presentPacks.apply.boundC2Effects
      contains: sts1.combat.hand
  - assert:
      path: presentPacks.apply.boundC2Effects
      contains: sts1.event
  - console: "art lab start-run IRONCLAD"
  - wait_ms: 25000
  - console: "art present combat on"
  - console: "art present energy on"
  - console: "art present intents on"
  - console: "art present proceed on"
  - console: "fight Cultist"
  - wait_probe:
      timeout_ms: 30000
      interval_ms: 1000
      assert:
        path: projection.scene
        eq: combat
  - wait_probe:
      timeout_ms: 10000
      interval_ms: 500
      assert:
        path: backend.input.handState
        eq: FULL_READY
  - wait_probe:
      timeout_ms: 8000
      interval_ms: 500
      assert:
        path: render.c2SurfaceEffects.sts1_combat_hand.effectIds
        contains: lightwave
  - wait_probe:
      timeout_ms: 8000
      interval_ms: 500
      assert:
        path: render.c2ItemEffects.sts1_combat_hand.count
        gte: 1
  - assert:
      path: render.c2ItemEffects.sts1_combat_hand.targets[0].effectIds
      contains: lightwave
  - assert:
      path: render.c2ItemEffects.sts1_combat_hand.targets[0].w
      gte: 100
  - assert:
      path: render.c2ItemEffects.sts1_combat_controls.count
      eq: 1
  - assert:
      path: render.c2ItemEffects.sts1_combat_controls.targets[0].effectIds
      contains: lightwave
  - assert:
      path: render.c2SurfaceEffects.sts1_combat_controls.effectIds
      contains: lightwave
  - assert:
      path: render.c2SurfaceEffects.sts1_combat_energy.effectIds
      contains: lightwave
  - assert:
      path: render.c2SurfaceEffects.sts1_combat_intents.effectIds
      contains: lightwave
  - assert:
      path: render.c2SurfaceEffects.sts1_combat_proceed.effectIds
      contains: lightwave
  - console: "art profile set sts"
  - wait_ms: 400
  - probe: all
  - assert:
      path: presentProfile.active
      eq: sts
  - assert:
      path: presentPacks.active
      eq: ""
