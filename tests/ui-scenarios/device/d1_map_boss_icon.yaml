# D1 (M07): native map BOSS icon. Under ART full present the native `DungeonMapScreen.render` (which
# calls `DungeonMap.renderBossIcon`) is suppressed, and the boss icon was previously missing entirely.
# This scenario mounts the ART map surface, scrolls the boss into view, and asserts the pinned boss
# probe facts (`backend.mapDraw.boss*` + `paintOrder`), then cleans up.
#
# Mechanism: native `DungeonMap.renderBossIcon` draws the static boss texture + its outline AFTER the
# whole node band at w = h = 512*scale, x = WIDTH/2 - w/2, y = offsetY + mapOffsetY + 1416*scale. The
# boss sits far below the node band, so this scenario scrolls it in with
# `DungeonMapScreen.offsetY = -2300*Settings.scale` and asserts SCROLL-INDEPENDENT facts (resource ids,
# boss.w == boss.h, the non-white color, the boss band in paintOrder) that hold at any scroll.
#
# Order-independence: leading + terminal `art present map off` reset and an explicit fresh-menu reset
# before start-run, mirroring the sibling map scenarios (`d1_full_present_map_ready.yaml`,
# `d1_map_hover.yaml`).
name: d1_map_boss_icon
schemaVersion: 1
mode: device
device: d1
require:
  env:
    - ART_D1_SERIAL
    - STS_CONNECTOR_PORT
    - SLAY_THE_AMETHYST_ROOT
steps:
  # Idempotent leading reset: clear any map surface left by a prior scenario before fresh-menu.
  - console: "art present map off"
  - wait_ms: 800
  - wait_probe:
      timeout_ms: 8000
      interval_ms: 500
      assert:
        path: backend.fullPresent.map
        eq: "OFF"
  # Fixed seed (same style as the sibling map scenarios; the scene is asserted literally because `eq`
  # is not interpolated).
  - set:
      seed: ARTMAPB01
      target: map
  - console: "art lab ensure-fresh-menu"
  - wait_ms: 8000
  - console: "art lab seed ${seed}"
  - wait_ms: 500
  - console: "art lab start-run IRONCLAD seed=${seed}"
  - wait_probe:
      timeout_ms: 45000
      interval_ms: 500
      assert:
        path: lab.recipe.status
        eq: ok
  - wait_probe:
      timeout_ms: 30000
      interval_ms: 500
      assert:
        path: lab.runReady
        eq: true
  # Leave Neow/event so first-floor map nodes become selectable (room COMPLETE).
  - console: "art lab proceed"
  - wait_ms: 3000
  - console: "art lab proceed"
  - wait_ms: 3000
  # STS MapRoomNode first-pick requires `currRoom.phase == COMPLETE`, and COMPLETE MUST be set BEFORE
  # the pick (the PROVEN order in `d1_full_present_map_ready.yaml`).
  - console: "evalcode com.megacrit.cardcrawl.dungeons.AbstractDungeon.getCurrRoom().phase=com.megacrit.cardcrawl.rooms.AbstractRoom.RoomPhase.COMPLETE"
  # A pending lab room transition is not a legal target for ART's map bridge.
  - console: "evalcode com.megacrit.cardcrawl.dungeons.AbstractDungeon.nextRoom=null"
  - wait_ms: 500
  - console: "evalcode com.megacrit.cardcrawl.dungeons.AbstractDungeon.dungeonMapScreen.open(false)"
  # Mount first: StageHost publishes native frames while a present surface is active.
  - console: "art present map on"
  - wait_probe:
      timeout_ms: 20000
      interval_ms: 500
      assert:
        path: projection.available
        eq: true
  - wait_probe:
      timeout_ms: 20000
      interval_ms: 500
      assert:
        path: projection.scene
        eq: map
  - wait_probe:
      timeout_ms: 10000
      interval_ms: 500
      assert:
        path: backend.renderPlan.entries[0].effectiveState
        eq: FULL_READY
  # Bring the boss INTO VIEW. The boss sits far below the node band (native y ~ offsetY + mapOffsetY +
  # 1416*scale), so scroll the map up and let the probe republish.
  - console: "evalcode com.megacrit.cardcrawl.screens.DungeonMapScreen.offsetY=-2300.0F*com.megacrit.cardcrawl.core.Settings.scale"
  - wait_probe:
      timeout_ms: 10000
      interval_ms: 500
      assert:
        path: backend.mapDraw.bossVisible
        eq: true
  - assert:
      path: backend.mapDraw.bossCount
      eq: 2
  # Scroll-independent boss facts: the boss (fill) and its outline are two distinct resolved resources.
  - assert:
      path: backend.mapDraw.boss.resourceId
      contains: "map.boss."
  - assert:
      path: backend.mapDraw.bossOutline.resourceId
      contains: "map.boss.outline."
  # Native geometry w == h == 512*scale, so the drawn boss is square at any background scale/width.
  - assert:
      path: backend.mapDraw.boss.y
      exists: true
  - capture:
      path: backend.mapDraw.boss.h
      var: boss_h
  - assert:
      path: backend.mapDraw.boss.w
      eq_var: boss_h
  # The outline tint is (1,1,1, bossNodeColor.a); the boss tint is the projected bossNodeColor, which
  # is NEVER white (AVAILABLE/NOT_TAKEN rgb), so colorHex must differ from ffffffff.
  - assert:
      path: backend.mapDraw.bossOutline.colorHex
      contains: "ffffff"
  - assert:
      path: backend.mapDraw.boss.colorHex
      neq: "ffffffff"
  # The boss band must follow the node band in native paint order.
  - assert:
      path: backend.mapDraw.paintOrder
      contains: "boss:outline"
  # Terminal cleanup: leave the device without a map surface.
  - console: "art present map off"
  - wait_ms: 800
  - wait_probe:
      timeout_ms: 8000
      interval_ms: 500
      assert:
        path: backend.fullPresent.map
        eq: "OFF"
