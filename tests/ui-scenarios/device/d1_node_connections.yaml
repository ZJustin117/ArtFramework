# D1: declarative connections drive lightwave pulse (signal → pulse_effect).
# Requires open game + ART_PROBE. After jar deploy.
name: d1_node_connections
schemaVersion: 1
mode: device
device: d1
require:
  env:
    - ART_D1_SERIAL
    - STS_CONNECTOR_PORT
    - SLAY_THE_AMETHYST_ROOT
steps:
  - console: "art open lightwave_demo"
  - wait_ms: 900
  - probe: all
  - assert:
      path: windows.openIds
      contains: lightwave_demo
  - assert:
      path: render.demoEffects.lightwave_demo.hasLightwave
      eq: true
  - console: "art op button lightwave_demo ok"
  - wait_ms: 200
  - probe: all
  - assert:
      path: render.demoEffects.lightwave_demo.bound
      eq: true
  - assert:
      path: render.demoEffects.lightwave_demo.hasLightwave
      eq: true
  - console: "art op slider lightwave_demo wave_slider 0.7"
  - wait_ms: 250
  - probe: all
  - assert:
      path: windows.byId.lightwave_demo.controls.sliders.wave_slider
      gte: 0.65
  - assert:
      path: windows.byId.lightwave_demo.controls.sliders.wave_slider
      lte: 0.75
  - console: "art close lightwave_demo"
  - wait_ms: 400
  - probe: all
  - assert:
      path: render.demoEffects.lightwave_demo.bound
      eq: false
