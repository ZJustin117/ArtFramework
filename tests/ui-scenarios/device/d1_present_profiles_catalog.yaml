# D1: global PresentProfile catalog on live ART_PROBE (milestone 37).
# Register is Java-only; device asserts builtins + project apply + restyle + lightwave open.
name: d1_present_profiles_catalog
schemaVersion: 1
mode: device
device: d1
require:
  env:
    - ART_D1_SERIAL
    - STS_CONNECTOR_PORT
    - SLAY_THE_AMETHYST_ROOT
steps:
  - probe: all
  - assert:
      path: schemaVersion
      eq: 1
  - assert:
      path: presentProfiles.count
      gte: 2
  - assert:
      path: presentProfiles.ids
      contains: sts
  - assert:
      path: presentProfiles.ids
      contains: lightwave
  - assert:
      path: presentProfiles.byId.sts.id
      eq: sts
  - assert:
      path: presentProfiles.byId.lightwave.themeName
      eq: lightwave
  - assert:
      path: presentProfile.registeredIds
      contains: sts
  - assert:
      path: presentProfile.registeredIds
      contains: lightwave
  - console: "art profile list"
  - wait_ms: 150
  - console: "art profile set lightwave"
  - wait_ms: 400
  - probe: all
  - assert:
      path: projectPresent.project
      eq: lightwave
  - assert:
      path: presentProfile.active
      eq: lightwave
  - assert:
      path: theme.name
      eq: lightwave
  - console: "art open demo"
  - wait_ms: 600
  - probe: all
  - assert:
      path: windows.openIds
      contains: demo
  # demo has no present_profile → from project lightwave after set
  - assert:
      path: windows.byId.demo.present.id
      eq: lightwave
  - assert:
      path: windows.byId.demo.present.fromProject
      eq: true
  - console: "art close demo"
  - wait_ms: 300
  - console: "art open lightwave_demo"
  - wait_ms: 900
  - probe: all
  - assert:
      path: windows.openIds
      contains: lightwave_demo
  - assert:
      path: windows.byId.lightwave_demo.present.id
      eq: lightwave
  - assert:
      path: render.demoEffects.lightwave_demo.hasLightwave
      eq: true
  - console: "art profile resolve lightwave_demo"
  - wait_ms: 100
  - console: "art close lightwave_demo"
  - wait_ms: 400
  - console: "art profile set sts"
  - wait_ms: 300
  - probe: all
  - assert:
      path: projectPresent.project
      eq: sts
