# Real device: spireui probe via connector + SPIREUI_PROBE log scrape.
# Prerequisites: docs/development/android-device-lab.md (connector + cold start + SpireUI.jar).
name: d1_probe_smoke
schemaVersion: 1
mode: device
device: d1
require:
  env:
    - SPIREUI_D1_SERIAL
    - STS_CONNECTOR_PORT
    - SLAY_THE_AMETHYST_ROOT
steps:
  - console: "spireui bind sts.map"
  - wait_ms: 300
  - console: "spireui bind sts.endturn"
  - wait_ms: 300
  - probe: all
  - assert:
      path: schemaVersion
      eq: 1
  - assert:
      path: modId
      eq: spireui
  - assert:
      path: templates.mapBound
      eq: true
  - assert:
      path: templates.endTurnBound
      eq: true
