# Real device: art probe via connector + ART_PROBE log scrape.
# Prerequisites: docs/development/android-device-lab.md (connector + cold start + ArtFramework.jar).
name: d1_probe_smoke
schemaVersion: 1
mode: device
device: d1
require:
  env:
    - ART_D1_SERIAL
    - STS_CONNECTOR_PORT
    - SLAY_THE_AMETHYST_ROOT
steps:
  - console: "art bind sts1.map"
  - wait_ms: 300
  - console: "art bind sts1.endturn"
  - wait_ms: 300
  - probe: all
  - assert:
      path: schemaVersion
      eq: 1
  - assert:
      path: modId
      eq: artframework
  - assert:
      path: templates.mapBound
      eq: true
  - assert:
      path: templates.endTurnBound
      eq: true
