# D1: render z-order contract — the resolved plan is deterministic, phase-ordered, and the
# native/ART boundary is reported honestly. This scenario produces probe evidence only; it does
# not assert pixel suppression, which is not implemented.
name: d1_render_zorder_contract
schemaVersion: 1
mode: device
device: d1
require:
  env:
    - ART_D1_SERIAL
    - STS_CONNECTOR_PORT
    - SLAY_THE_AMETHYST_ROOT
steps:
  - console: "art lab ensure-fresh-menu"
  - wait_probe:
      timeout_ms: 45000
      interval_ms: 500
      assert:
        path: lab.recipe.status
        eq: ok
  - console: "art lab start-run IRONCLAD"
  - wait_probe:
      timeout_ms: 45000
      interval_ms: 500
      assert:
        path: lab.recipe.status
        eq: ok
  - wait_probe:
      timeout_ms: 30000
      interval_ms: 500
      assert:
        path: lab.runReady
        eq: true
  - console: "art present combat on"
  - console: "fight Cultist"
  - wait_probe:
      timeout_ms: 30000
      interval_ms: 1000
      assert:
        path: projection.scene
        eq: combat
  - wait_probe:
      timeout_ms: 10000
      interval_ms: 500
      assert:
        path: backend.input.handState
        eq: FULL_READY
  - wait_probe:
      timeout_ms: 10000
      interval_ms: 250
      assert:
        path: backend.handDraw.count
        gte: 1
  # Resolved render order is exposed and has no duplicate stable keys.
  - assert:
      path: render.renderOrder.status
      eq: ready
  - assert:
      path: render.renderOrder.count
      gte: 4
  - assert:
      path: render.renderOrder.monotonic
      eq: true
  - assert:
      path: render.renderOrder.duplicateStableKeys
      eq: []
  # The native boundary is retained and sorts below ART-owned content. NATIVE_RETAINED has the
  # lowest rank of any item present in a combat frame, so the first entry must carry it.
  - assert:
      path: render.renderOrder.items[0].phase
      eq: NATIVE_RETAINED
  # ART-owned C2 surface content is present and carries its own phase metadata.
  - assert:
      path: render.targetsById.c2_surface_sts1_combat_hand.phase
      eq: C2_CONTENT
  - assert:
      path: render.targetsById.c2_surface_sts1_combat_hand.stableKey
      eq: c2:surface:sts1.combat.hand
  # The host reports the real boundary: retained post-native ART submission plus the distinct
  # verified pre-native background draw point.
  - assert:
      path: backend.renderBoundary.nativeInterval
      eq: stage.draw
  - assert:
      path: backend.renderBoundary.artInterval
      eq: post_native_overlay
  - assert:
      path: backend.renderBoundary.backgroundCapability
      eq: pre_native
  - assert:
      path: backend.renderBoundary.supportsPreNativeBackground
      eq: true
  # Visual verification modes: background is ready via the pre-native hook.
  - assert:
      path: backend.verify.configuredMode
      eq: "off"
  - assert:
      path: backend.verify.submissionStatus
      eq: disabled
  - console: "art verify mode background"
  - wait_probe:
      timeout_ms: 5000
      interval_ms: 250
      assert:
        path: backend.verify.configuredMode
        eq: background
  - assert:
      path: backend.verify.submissionStatus
      eq: ready
  - assert:
      path: backend.verify.modeSupported
      eq: true
  - console: "art verify mode off"
  - wait_probe:
      timeout_ms: 5000
      interval_ms: 250
      assert:
        path: backend.verify.configuredMode
        eq: "off"
  # --- Native local render-order band baseline (NRO-04 C01) ---
  # The container seam replaces the three AbstractDungeon.render effect call sites in place, so
  # band membership IS native order. backend.renderPlan.nativeRender.effectBands records WHICH
  # native band each observed effect render (native vs claimed bucket) happened in, classified by
  # the instrumented LineNumberTable line: effectList/renderBehind-before-room (A), effectList/
  # front-after-room (B), topLevelEffects/above-top-panel (C). Lifetime-global counters, so the
  # gate-OFF baseline below is asserted as gte (never absolute).
  #
  # Gate-OFF phase: native stays authoritative and the baseline must see BOTH effect-list bands.
  # flareL -> LightFlareLEffect (renderBehind=true) -> band A; fire -> FireBurstParticleEffect
  # (default renderBehind=false) -> band B.
  - console: "art claim off"
  - console: "art claim spawn flareL 4"
  - console: "art claim spawn fire 4"
  - wait_probe:
      timeout_ms: 10000
      interval_ms: 250
      assert:
        path: backend.renderPlan.nativeRender.effectBands.native.effectListBehind
        gte: 1
  - wait_probe:
      timeout_ms: 10000
      interval_ms: 250
      assert:
        path: backend.renderPlan.nativeRender.effectBands.native.effectListFront
        gte: 1
  # NRO-04 C02: within-render-pass band ORDINAL evidence. Within one AbstractDungeon.render pass the
  # three call sites are strictly sequential (A rank 0 -> B rank 1 -> C rank 2); a lower ordinal
  # after a higher one inside the SAME pass is a violation. The pass boundary is an explicit counter
  # bumped at AbstractDungeon.render entry (NOT the ART frame id, which is stale on menu/transition
  # screens). UNKNOWN bands never contribute. Wait for at least one observed pass first so the read
  # cannot be premature, then require zero violations.
  - wait_probe:
      timeout_ms: 10000
      interval_ms: 250
      assert:
        path: backend.renderPlan.nativeRender.effectBands.passesObserved
        gte: 1
  - assert:
      path: backend.renderPlan.nativeRender.effectBands.orderViolations
      eq: 0
  # NRO-04 C03: same-layer per-band ORDERED observation SEQUENCE. Beyond the C02 per-pass ordinal,
  # effectBands.sequence records the ACTUAL native traversal order of the observations in the CURRENT
  # pass: one {claimed,class} entry per observation, appended in order and NEVER coalesced by class
  # name, so two distinct instances of one class appear as two entries. sequenceTruncated marks a
  # bounded tail (cap 16) that dropped an oldest entry, and interleave counts adjacent
  # claimed<->native transitions in the recorded tail (a witness over the bounded tail, not an
  # exhaustive count). The tail is PER CURRENT PASS and cleared at every AbstractDungeon.render
  # entry, so the D1 sequence assertion targets the reliably-populated band A tail
  # (effectListBehind: ambient torches render every pass). Band-B observation is covered by the
  # cumulative gate-ON `claimed.effectListFront gte 1` count (cumulative, not per-pass) — never
  # assert a transient per-pass band-B tail on device. Exact per-band ordering and instance
  # coalescing are pinned by the pure unit tests. Poll until the band-A tail is non-empty (a pass can
  # momentarily be empty right after its entry clear), then assert key presence and zero violations;
  # no exact list length and no exact tail contents.
  - console: "art claim off"
  - console: "art claim spawn flareL 8"
  - console: "art claim spawn fire 8"
  - wait_probe:
      timeout_ms: 10000
      interval_ms: 250
      assert:
        path: backend.renderPlan.nativeRender.effectBands.sequence.effectListBehind[0].class
        exists: true
  - assert:
      path: backend.renderPlan.nativeRender.effectBands.sequenceTruncated.effectListBehind
      exists: true
  - assert:
      path: backend.renderPlan.nativeRender.effectBands.interleave.effectListBehind
      gte: 0
  - assert:
      path: backend.renderPlan.nativeRender.effectBands.orderViolations
      eq: 0
  # Gate-ON phase: the real renderer is ready, so the claimed draws must land in their CORRECT
  # native bands A and B — not merely be observed.
  - console: "art claim on"
  - wait_probe:
      timeout_ms: 8000
      interval_ms: 200
      assert:
        path: backend.renderPlan.aura.ready
        gte: 1
  - console: "art claim spawn flareL 4"
  - console: "art claim spawn fire 4"
  - wait_probe:
      timeout_ms: 10000
      interval_ms: 250
      assert:
        path: backend.renderPlan.nativeRender.effectBands.claimed.effectListBehind
        gte: 1
  - wait_probe:
      timeout_ms: 10000
      interval_ms: 250
      assert:
        path: backend.renderPlan.nativeRender.effectBands.claimed.effectListFront
        gte: 1
  # NRO-04 C02: the SAME ordinal state is shared by native and claimed draws, so the gate-ON phase
  # must also show zero within-pass order violations. Poll passesObserved first (never a premature
  # read), then assert the cumulative zero-violation invariant.
  - wait_probe:
      timeout_ms: 10000
      interval_ms: 250
      assert:
        path: backend.renderPlan.nativeRender.effectBands.passesObserved
        gte: 1
  - assert:
      path: backend.renderPlan.nativeRender.effectBands.orderViolations
      eq: 0
  # The claimed band map exists and is bounded (key presence only; do not over-constrain unknown).
  - assert:
      path: backend.renderPlan.nativeRender.effectBands.claimed.topLevelFront
      gte: 0
  - assert:
      path: backend.renderPlan.nativeRender.effectBands.claimedByClassCap
      gte: 0
  # NRO-04 C03 gate-ON: the same-layer ordered sequence now carries the claimed draws interleaved with
  # native observations of the same band, in native traversal order, and never coalesces distinct
  # instances. Assert presence + zero violations only (no exact tail contents/length on device).
  - console: "art claim spawn flareL 8"
  - console: "art claim spawn fire 8"
  - wait_probe:
      timeout_ms: 10000
      interval_ms: 250
      assert:
        path: backend.renderPlan.nativeRender.effectBands.sequence.effectListBehind[0].class
        exists: true
  - assert:
      path: backend.renderPlan.nativeRender.effectBands.sequenceTruncated.effectListBehind
      exists: true
  - assert:
      path: backend.renderPlan.nativeRender.effectBands.interleave.effectListBehind
      gte: 0
  - assert:
      path: backend.renderPlan.nativeRender.effectBands.orderViolations
      eq: 0
  - console: "art claim clear"
  - console: "art claim off"
