# D1: animation state and bone transform for the rendered Spine 3.4 skeleton.
name: d1_spine34_animation
schemaVersion: 1
mode: device
device: d1
require:
  env:
    - ART_D1_SERIAL
    - STS_CONNECTOR_PORT
    - SLAY_THE_AMETHYST_ROOT
steps:
  - wait_ms: 15000
  - console: "art present skeleton on"
  - console: "art skeleton sts1 load d1_ironclad images/characters/ironclad/idle/skeleton.atlas images/characters/ironclad/idle/skeleton.json"
  - console: "art skeleton sts1 play d1_ironclad Idle"
  - wait_ms: 1000
  - probe: all
  - assert:
      path: backend.skeleton.currentAnimation
      eq: Idle
  - assert:
      path: backend.skeleton.spine34RendererAvailable
      eq: true
