# D1: repeated stop and panic cleanup for Spine 3.4 runtime bindings.
name: d1_spine34_lifecycle
schemaVersion: 1
mode: device
device: d1
require:
  env:
    - ART_D1_SERIAL
    - STS_CONNECTOR_PORT
    - SLAY_THE_AMETHYST_ROOT
steps:
  - wait_ms: 15000
  - console: "art present skeleton on"
  - console: "art skeleton sts1 load d1_ironclad images/characters/ironclad/idle/skeleton.atlas images/characters/ironclad/idle/skeleton.json"
  - console: "art skeleton sts1 stop d1_ironclad"
  - probe: all
  - assert:
      path: backend.skeleton.liveCount
      eq: 0
  - console: "art skeleton sts1 load d1_ironclad images/characters/ironclad/idle/skeleton.atlas images/characters/ironclad/idle/skeleton.json"
  - console: "art present panic spine34-test"
  - probe: all
  - assert:
      path: backend.skeleton.liveCount
      eq: 0
