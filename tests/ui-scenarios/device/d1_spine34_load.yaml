# D1: load and render a host-bundled Spine 3.4 skeleton through ART.
name: d1_spine34_load
schemaVersion: 1
mode: device
device: d1
require:
  env:
    - ART_D1_SERIAL
    - STS_CONNECTOR_PORT
    - SLAY_THE_AMETHYST_ROOT
steps:
  - wait_ms: 15000
  - console: "art present skeleton on"
  - console: "art skeleton sts1 load d1_ironclad images/characters/ironclad/idle/skeleton.atlas images/characters/ironclad/idle/skeleton.json"
  - wait_ms: 1000
  - probe: all
  - assert:
      path: backend.skeleton.liveCount
      eq: 1
  - assert:
      path: backend.skeleton.providerId
      eq: spine34
  - assert:
      path: backend.skeleton.spine34RendererAvailable
      eq: true
  - assert:
      path: backend.skeleton.spine34LastRenderError
      eq: ""
