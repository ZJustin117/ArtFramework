# D1: animation command smoke on the loaded developer rig.
name: d1_spine42_animation
schemaVersion: 1
mode: device
device: d1
require:
  env:
    - ART_D1_SERIAL
    - STS_CONNECTOR_PORT
    - SLAY_THE_AMETHYST_ROOT
steps:
  - wait_ms: 15000
  - console: "art present skeleton on"
  - console: "art skeleton dev load d1_ironclad animations/characters/ironclad/ironclad.atlas animations/characters/ironclad/ironclad.skel"
  - wait_ms: 1000
  - console: "art skeleton dev play d1_ironclad idle_loop"
  - wait_ms: 500
  - probe: all
  - assert:
      path: backend.skeleton.liveCount
      eq: 1
  - assert:
      path: backend.skeleton.live.d1_ironclad.currentAnimation
      eq: idle_loop
  - console: "art skeleton dev play d1_ironclad attack"
  - wait_ms: 500
  - probe: all
  - assert:
      path: backend.skeleton.liveCount
      eq: 1
  - assert:
      path: backend.skeleton.live.d1_ironclad.currentAnimation
      eq: attack
  - console: "art skeleton dev bone d1_ironclad root"
  - wait_ms: 300
  - probe: all
  - assert:
      path: backend.skeleton.lastBoneTransform.x
      exists: true
