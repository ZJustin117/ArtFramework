# D1: optional developer Spine42 runtime and asset bundle status.
name: d1_spine42_assets_status
schemaVersion: 1
mode: device
device: d1
require:
  env:
    - ART_D1_SERIAL
    - STS_CONNECTOR_PORT
    - SLAY_THE_AMETHYST_ROOT
steps:
  - wait_ms: 15000
  - probe: all
  - assert:
      path: backend.skeleton.providerId
      eq: spine42
  - assert:
      path: backend.skeleton.spine42BundleConfigured
      eq: true
  - assert:
      path: backend.skeleton.spine42Available
      eq: true
