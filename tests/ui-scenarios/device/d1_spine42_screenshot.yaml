# D1 FROZEN-POSE GL DETERMINISM (identical deformed-vertex signature on re-render),
# NOT native-reference pixel parity.
#
# This scenario verifies that the frozen Spine42 pose renders DETERMINISTICALLY. It freezes the
# idle_loop pose, captures the render-path deformed-vertex signature
# (`backend.skeleton.drawEvidence.vertexSignature`, i.e. the last-render
# `Sts1Spine42Provider.lastRenderVertexSignature("d1_ironclad")`), waits a bounded interval
# WITHOUT unfreezing, refreshes the probe, and requires the re-rendered pose to produce the SAME
# signature. No external golden file is read, so it runs without any developer-local reference.
#
# WHY NOT A PIXEL COMPARE: the device is NOT frame-frozen outside the ART skeleton. A crop around
# the ART skeleton on the fixed 1920x1080 D1 orientation still bleeds the ANIMATING native
# background (player idle, Cultist idle, torch flames, hand). The last recorded run of the prior
# pixel gate (`compare_screenshot against: previous_capture`, crop [860,330,220,300]) measured
# 20.0% / 16.6% crop change (13200 / 10975 px) — far over the intended limits — while the ART
# pose itself was provably stable: `backend.skeleton.drawEvidence.vertexSignature` was
# BYTE-IDENTICAL across both captures (`de235afb6f46c550`, drawEvidence.count 675 both times).
# The pixel gate is therefore removed; the two `screenshot: true` captures below remain ONLY as
# advisory visual-reviewer evidence and are NOT asserted on.
#
# NATIVE-REFERENCE PIXEL PARITY (ART pixels vs a paired native golden) is a separate check that
# needs a developer-local `ART_SPINE42_REFERENCE_PNG`; it remains OPEN and developer-gated, see
# docs/design/spine42-present.md 47.35 and docs/task.md F08.
name: d1_spine42_screenshot
schemaVersion: 1
mode: device
device: d1
require:
  env:
    - ART_D1_SERIAL
    - STS_CONNECTOR_PORT
    - ART_GAME_PROBE_PORT
    - ART_HARNESS_OUT_DIR
    - SLAY_THE_AMETHYST_ROOT
steps:
  - wait_ms: 15000
  - console: "art lab ensure-fresh-menu"
  - wait_probe:
      timeout_ms: 45000
      interval_ms: 500
      assert:
        path: lab.recipe.status
        eq: ok
  - console: "art lab start-run IRONCLAD"
  - wait_probe:
      timeout_ms: 45000
      interval_ms: 500
      assert:
        path: lab.recipe.status
        eq: ok
  - wait_probe:
      timeout_ms: 30000
      interval_ms: 500
      assert:
        path: lab.runReady
        eq: true
  - console: "fight Cultist"
  - wait_probe:
      timeout_ms: 30000
      interval_ms: 500
      assert:
        path: lab.inCombat
        eq: true
  - wait_probe:
      timeout_ms: 10000
      interval_ms: 500
      assert:
        path: lab.roomPhase
        eq: COMBAT
  - console: "art present skeleton on"
  - console: "art skeleton dev load d1_ironclad animations/characters/ironclad/ironclad.atlas animations/characters/ironclad/ironclad.skel"
  - wait_ms: 1000
  - console: "art skeleton dev play d1_ironclad idle_loop"
  - wait_ms: 1000
  - console: "art skeleton dev seek d1_ironclad 0.0"
  - wait_ms: 500
  - console: "art skeleton dev freeze d1_ironclad"
  - probe: all
  - assert:
      path: backend.skeleton.providerId
      eq: spine42
  - assert:
      path: backend.skeleton.liveCount
      eq: 1
  - assert:
      path: backend.skeleton.lastError
      eq: ""
  - assert:
      path: present[4].id
      eq: sts1.skeleton
  - assert:
      path: present[4].mounted
      eq: true
  - assert:
      path: render.targetsById.c2_surface_sts1_skeleton.enabled
      eq: true
  # `drawEvidence.count` was intermittently 0 on fresh extra runs despite
  # providerId=spine42 / liveCount=1 / FULL_READY; retry until at least one render is observed.
  - wait_probe:
      timeout_ms: 10000
      interval_ms: 500
      assert:
        path: backend.skeleton.drawEvidence.count
        gte: 1
  # Fixed-pose evidence for the standalone ART render path (keys confirmed in the recorded
  # d1_spine42_screenshot run). Per-attachment/region/clip details are NOT exposed by the probe,
  # so no attachment/clip assert is possible here (documented gap).
  - assert:
      path: backend.skeleton.drawEvidence.handle
      eq: d1_ironclad
  - assert:
      path: backend.skeleton.drawEvidence.kind
      eq: standalone-art
  - assert:
      path: backend.skeleton.drawEvidence.path
      eq: "renderAll->provider.render"
  - assert:
      path: backend.skeleton.live.d1_ironclad.currentAnimation
      eq: idle_loop
  # FROZEN-POSE DETERMINISM: first sample of the render-path deformed-vertex signature.
  - capture:
      path: backend.skeleton.drawEvidence.vertexSignature
      var: sig1
  - assert:
      path: backend.skeleton.drawEvidence.vertexSignature
      exists: true
  # Advisory visual evidence only (not asserted): frozen pose, capture #1.
  - screenshot: true
  - wait_ms: 250
  # Refresh the probe WITHOUT unfreezing (`freeze` was never followed by `unfreeze`), so the
  # re-rendered pose is sampled fresh below.
  - probe: all
  - capture:
      path: backend.skeleton.drawEvidence.vertexSignature
      var: sig2
  # Deterministic re-render gate: the refreshed (re-rendered) frozen pose must produce the SAME
  # signature as the first sample. `eq_var` compares the live probe path against a captured var, so
  # it must reference sig1 — the pre-wait sample; asserting against sig2 (read from this same probe
  # refresh) would be a tautology and prove nothing.
  - assert:
      path: backend.skeleton.drawEvidence.vertexSignature
      eq_var: sig1
  # Advisory visual evidence only (not asserted): frozen pose, capture #2.
  - screenshot: true
