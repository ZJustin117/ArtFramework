# D1: HostAssets-backed STS1 semantic node gallery over the real host renderer.
name: d1_sts1_vanilla_nodes
schemaVersion: 1
mode: device
device: d1
require:
  env:
    - ART_D1_SERIAL
    - STS_CONNECTOR_PORT
    - SLAY_THE_AMETHYST_ROOT
steps:
  - console: "art profile set sts"
  - console: "art open sts1_vanilla_demo"
  - wait_ms: 1000
  - probe: all
  - assert:
      path: windows.openIds
      contains: sts1_vanilla_demo
  - assert:
      path: windows.byId.sts1_vanilla_demo.windowClass
      eq: SYNTHETIC
  - assert:
      path: windows.byId.sts1_vanilla_demo.buttonIds
      contains: end_turn
  - assert:
      path: render.targetsById.c1_sts1_vanilla_demo.enabled
      eq: true
  - console: "art profile set lightwave"
  - wait_ms: 500
  - probe: all
  - assert:
      path: windows.byId.sts1_vanilla_demo.present.id
      eq: lightwave
  - assert:
      path: render.targetsById.c1_sts1_vanilla_demo.effectIds
      contains: lightwave
  - console: "art close sts1_vanilla_demo"
  - console: "art profile set sts"
