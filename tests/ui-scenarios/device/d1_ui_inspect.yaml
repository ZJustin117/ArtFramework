# Open C1 demo and exercise art ui list/tree (log scrape ART_UI / ART_PROBE).
name: d1_ui_inspect
schemaVersion: 1
mode: device
device: d1
require:
  env:
    - ART_D1_SERIAL
    - STS_CONNECTOR_PORT
    - SLAY_THE_AMETHYST_ROOT
steps:
  - console: "art open demo"
  - wait_ms: 400
  - console: "art ui list"
  - wait_ms: 200
  - console: "art ui tree demo"
  - wait_ms: 200
  - console: "art ui node demo demo"
  - wait_ms: 200
  - console: "art ui native dump"
  - wait_ms: 200
  - probe: all
  - assert:
      path: schemaVersion
      eq: 1
  - assert:
      path: windows.openIds
      contains: demo
