# D1: pre-native background variants. Each variant (solid/checker/grid) must fully succeed:
#   retained  -> ART draws (artDrawCount grows) but the native scene background paints over it, so
#                the frame stays visually identical to the `off` baseline;
#   filtered  -> ART draws and the native background is skipped, so the ART fill reaches the frame.
# `off` must draw nothing and suppress nothing. The probe ledger and paired captures are the
# evidence; backgroundCapability is now `pre_native` (verified for all three variants).
name: d1_verify_background
schemaVersion: 1
mode: device
device: d1
require:
  env:
    - ART_D1_SERIAL
    - STS_CONNECTOR_PORT
    - SLAY_THE_AMETHYST_ROOT
    - ART_HARNESS_OUT_DIR
steps:
  - console: "art verify native clear"
  - console: "art verify mode background off"
  - console: "art lab ensure-fresh-menu"
  - wait_probe:
      timeout_ms: 45000
      interval_ms: 500
      assert:
        path: lab.recipe.status
        eq: ok
  - console: "art lab start-run IRONCLAD"
  - wait_probe:
      timeout_ms: 45000
      interval_ms: 500
      assert:
        path: lab.recipe.status
        eq: ok
  - wait_probe:
      timeout_ms: 30000
      interval_ms: 500
      assert:
        path: lab.runReady
        eq: true
  - console: "art present combat on"
  - console: "fight Cultist"
  - wait_probe:
      timeout_ms: 30000
      interval_ms: 1000
      assert:
        path: projection.scene
        eq: combat
  - wait_probe:
      timeout_ms: 10000
      interval_ms: 500
      assert:
        path: backend.input.handState
        eq: FULL_READY

  # Baseline: background off, no filter. ART draws nothing and suppresses nothing.
  - assert:
      path: backend.verify.background.variant
      eq: "off"
  - assert:
      path: backend.verify.background.artOwnsBackgroundRequested
      eq: false
  - capture:
      path: backend.verify.background.artDrawCount
      var: draw_baseline

  # ---- solid ----
  # A: off baseline frame (native background, no ART draw).
  - console: "art verify mode background off"
  - wait_probe:
      timeout_ms: 5000
      interval_ms: 250
      assert:
        path: backend.verify.background.variant
        eq: "off"
  - screenshot: true
  # B: retained (variant selected, family not filtered) -> draws, but hidden under native.
  - console: "art verify mode background solid"
  - wait_probe:
      timeout_ms: 5000
      interval_ms: 250
      assert:
        path: backend.verify.background.variant
        eq: solid
  - assert:
      path: backend.verify.background.artOwnsBackgroundRequested
      eq: false
  - assert:
      path: backend.verify.background.artDrawCount
      gt_var: draw_baseline
  - screenshot: true
  # Retained frame must match the off baseline (the ART fill is hidden under native pixels).
  - compare_screenshot:
      against: previous_capture
      threshold: 24
      max_diff_pixels: 80000
      max_diff_ratio: 0.10
  # C: filtered -> native background skipped, ART fill reaches the frame.
  - console: "art verify native sts1.room.background on"
  - wait_probe:
      timeout_ms: 5000
      interval_ms: 250
      assert:
        path: backend.verify.background.artOwnsBackgroundRequested
        eq: true
  - screenshot: true
  - compare_screenshot:
      against: previous_capture
      threshold: 24
      max_diff_pixels: 100000000
      max_diff_ratio: 1.0
      min_diff_ratio: 0.20
  - console: "art verify native sts1.room.background off"

  # ---- checker ----
  - console: "art verify mode background off"
  - wait_probe:
      timeout_ms: 5000
      interval_ms: 250
      assert:
        path: backend.verify.background.variant
        eq: "off"
  - screenshot: true
  - console: "art verify mode background checker"
  - wait_probe:
      timeout_ms: 5000
      interval_ms: 250
      assert:
        path: backend.verify.background.variant
        eq: checker
  - assert:
      path: backend.verify.background.artOwnsBackgroundRequested
      eq: false
  - screenshot: true
  - compare_screenshot:
      against: previous_capture
      threshold: 24
      max_diff_pixels: 80000
      max_diff_ratio: 0.10
  - console: "art verify native sts1.room.background on"
  - wait_probe:
      timeout_ms: 5000
      interval_ms: 250
      assert:
        path: backend.verify.background.artOwnsBackgroundRequested
        eq: true
  - screenshot: true
  - compare_screenshot:
      against: previous_capture
      threshold: 24
      max_diff_pixels: 100000000
      max_diff_ratio: 1.0
      min_diff_ratio: 0.20
  - console: "art verify native sts1.room.background off"

  # ---- grid ----
  - console: "art verify mode background off"
  - wait_probe:
      timeout_ms: 5000
      interval_ms: 250
      assert:
        path: backend.verify.background.variant
        eq: "off"
  - screenshot: true
  - console: "art verify mode background grid"
  - wait_probe:
      timeout_ms: 5000
      interval_ms: 250
      assert:
        path: backend.verify.background.variant
        eq: grid
  - assert:
      path: backend.verify.background.artOwnsBackgroundRequested
      eq: false
  - screenshot: true
  - compare_screenshot:
      against: previous_capture
      threshold: 24
      max_diff_pixels: 80000
      max_diff_ratio: 0.10
  - console: "art verify native sts1.room.background on"
  - wait_probe:
      timeout_ms: 5000
      interval_ms: 250
      assert:
        path: backend.verify.background.artOwnsBackgroundRequested
        eq: true
  - screenshot: true
  - compare_screenshot:
      against: previous_capture
      threshold: 24
      max_diff_pixels: 100000000
      max_diff_ratio: 1.0
      min_diff_ratio: 0.20
  - console: "art verify native sts1.room.background off"

  # ---- bottom (E06: real ACT-1 TheBottomScene combat layers) ----
  # Unlike solid/checker/grid, `bottom` needs the live scene atlas, so the synthetic
  # `renderSelectedVariant` path draws nothing for it; the ART layers are submitted from the
  # pre-native Prefix. Retained -> native paints over the ART layers (frame matches off baseline);
  # filtered -> native background skipped, the ART bottom layers reach the frame.
  - console: "art verify mode background off"
  - wait_probe:
      timeout_ms: 5000
      interval_ms: 250
      assert:
        path: backend.verify.background.variant
        eq: "off"
  - capture:
      path: backend.verify.background.artDrawCount
      var: bottom_draw_baseline
  - screenshot: true
  - console: "art verify mode background bottom"
  - wait_probe:
      timeout_ms: 5000
      interval_ms: 250
      assert:
        path: backend.verify.background.variant
        eq: bottom
  - assert:
      path: backend.verify.background.artOwnsBackgroundRequested
      eq: false
  # Real-layer evidence: artDrawCount is a CUMULATIVE counter shared by every variant, so its
  # absolute value is meaningless here; the delta over the off baseline is what proves the bottom
  # variant submitted its own real layers this frame (bg/mg/ceiling, plus any flagged wall) rather
  # than the single synthetic quad.
  - assert:
      path: backend.verify.background.artDrawCount
      gt_var: bottom_draw_baseline
  - screenshot: true
  # Retained frame matches the off baseline (native background paints over the ART layers).
  - compare_screenshot:
      against: previous_capture
      threshold: 24
      max_diff_pixels: 80000
      max_diff_ratio: 0.10
  - console: "art verify native sts1.room.background on"
  - wait_probe:
      timeout_ms: 5000
      interval_ms: 250
      assert:
        path: backend.verify.background.artOwnsBackgroundRequested
        eq: true
  - screenshot: true
  # E06: the `bottom` variant FAITHFULLY reproduces the native ACT-1 background, so suppressing
  # native and drawing the ART layers leaves the frame NEAR-IDENTICAL to the retained frame (unlike
  # the synthetic solid/checker/grid, whose 20%+ diff is intentional). The real-layer submission is
  # proven above by the artDrawCount delta (multi-layer, not one quad), so here we require the
  # filtered frame to stay CLOSE to the retained native frame — a large diff would mean the ART
  # layers failed to draw (blanked background) or diverged from native.
  - compare_screenshot:
      against: previous_capture
      threshold: 24
      max_diff_pixels: 140000
      max_diff_ratio: 0.12
  - console: "art verify native sts1.room.background off"
  - console: "art verify mode background off"

  # ---- back to off: no draw, no suppression ----
  - console: "art verify mode background off"
  - wait_probe:
      timeout_ms: 5000
      interval_ms: 250
      assert:
        path: backend.verify.background.variant
        eq: "off"
  - assert:
      path: backend.verify.background.artOwnsBackgroundRequested
      eq: false
