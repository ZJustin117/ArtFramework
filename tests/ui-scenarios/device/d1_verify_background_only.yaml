# Strict background-only probe. This is intentionally separate from native-isolate: it proves the
# deny-by-default gate and records the remaining unpatched native world as unsupported/uncovered.
name: d1_verify_background_only
schemaVersion: 1
mode: device
device: d1
require:
  env:
    - ART_D1_SERIAL
    - STS_CONNECTOR_PORT
    - SLAY_THE_AMETHYST_ROOT
steps:
  - console: "art verify mode background-only off"
  - console: "art verify mode background checker"
  - console: "art lab ensure-fresh-menu"
  - wait_probe:
      timeout_ms: 45000
      interval_ms: 500
      assert:
        path: lab.recipe.status
        eq: ok
  - console: "art lab start-run IRONCLAD"
  - wait_probe:
      timeout_ms: 45000
      interval_ms: 500
      assert:
        path: lab.recipe.status
        eq: ok
  - wait_probe:
      timeout_ms: 30000
      interval_ms: 500
      assert:
        path: lab.runReady
        eq: true
  # The strict-acceptance block below must run with NO ART draw output pending. `art present combat
  # observe` mounts the combat surfaces ONLY in observe level: it keeps the authority frame published
  # (so `projection.scene == combat`) and keeps the patched native entry points owning the frame, but
  # `FullPresentCapability` resolves each surface to OBSERVING, so `Sts1RenderPipeline.plan()` has an
  # empty `drawOrder()` (no ART plan entries). Blocked-foreground evidence is still produced by the
  # native combat renderer's patched entry points (hand/controls/energy/pile) and by the scene effects
  # (torches/flares), which route through the blocked seams independently of any mounted surface.
  - console: "art present combat observe"
  - console: "fight Cultist"
  - wait_probe:
      timeout_ms: 30000
      interval_ms: 1000
      assert:
        path: projection.scene
        eq: combat
  - console: "art verify mode background-only on"
  - wait_probe:
      timeout_ms: 10000
      interval_ms: 250
      assert:
        path: backend.verify.backgroundOnly.active
        eq: true
  - wait_probe:
      timeout_ms: 10000
      interval_ms: 250
      assert:
        path: backend.verify.background.variant
        eq: checker
  # E05: four-act background coverage contract. The background family patch targets all four
  # concrete scenes (`TheBottomScene`/`TheCityScene`/`TheBeyondScene`/`TheEndingScene`), exposed as
  # the static `patchedScenes` coverage list; the ART draw itself is act-agnostic (no act/room
  # argument). This asserts the CONTRACT only. D1 device evidence today is act-1/Bottom only: the
  # run below reaches the Bottom scene, and there is no lab act-jump, so City/Beyond/Ending are
  # patched but NOT device-verified here.
  - wait_probe:
      timeout_ms: 10000
      interval_ms: 250
      assert:
        path: backend.verify.background.patchedScenes
        exists: true
  - wait_probe:
      timeout_ms: 10000
      interval_ms: 250
      assert:
        path: backend.verify.background.patchedScenes
        contains: TheBottomScene
  - wait_probe:
      timeout_ms: 10000
      interval_ms: 250
      assert:
        path: backend.verify.backgroundOnly.backgroundDraw
        gte: 1
  - wait_probe:
      timeout_ms: 10000
      interval_ms: 250
      assert:
        path: backend.verify.backgroundOnly.backgroundSuppression
        gte: 1
  - wait_probe:
      timeout_ms: 10000
      interval_ms: 250
      assert:
        path: backend.verify.backgroundOnly.blockedForeground
        gte: 1
  # The current native world has unpatched creature/world entry points. Unsupported is required
  # evidence; this fixture must not claim a pure-background frame until it reaches zero.
  - wait_probe:
      timeout_ms: 10000
      interval_ms: 250
      assert:
        path: backend.verify.submissionStatus
        eq: unsupported
  # E04: ART-OUTPUT strictness. This strict block runs with `art present combat observe`, so the
  # surfaces are mounted for observation only and `Sts1RenderPipeline.plan()` emits NO ART draw
  # entries. The post-render uncovered marker is recorded only when genuine ART-OWNED output is
  # pending, so a frame whose only host targets are retained NATIVE scene boundaries reports ZERO
  # uncovered (zero ART submission / zero ART pass leaks) and passes strict ART-output acceptance.
  # This does NOT claim native world/foreground suppression: the player, monster, hand cards, and
  # terrain are still drawn natively and are NOT intercepted (a separate, larger slice).
  - wait_probe:
      timeout_ms: 10000
      interval_ms: 250
      assert:
        path: backend.verify.backgroundOnly.uncovered
        eq: 0
  - wait_probe:
      timeout_ms: 10000
      interval_ms: 250
      assert:
        path: backend.verify.backgroundOnly.strictAccepted
        eq: true
  # E01: bounded owner attribution. The uncovered map must remain exposed even when the count is
  # zero (no owner labels during a clean frame); do not assert a device-specific label here.
  - wait_probe:
      timeout_ms: 10000
      interval_ms: 250
      assert:
        path: backend.verify.backgroundOnly.uncoveredByOwner
        exists: true
  # E02: bounded blocked world/foreground owner attribution. The blocked foreground count must
  # resolve to at least one distinct normalized owner label, and the map must be exposed. Labels
  # today are the bounded call-site reasons (`surface:<family>`, `skeleton:<owner>`,
  # `effect:<class>`); do not assert a device-specific label here.
  - wait_probe:
      timeout_ms: 10000
      interval_ms: 250
      assert:
        path: backend.verify.backgroundOnly.blockedDistinct
        gte: 1
  - wait_probe:
      timeout_ms: 10000
      interval_ms: 250
      assert:
        path: backend.verify.backgroundOnly.blockedByOwner
        exists: true
  # E03: bounded unsupported-owner attribution for the black-screen/overlay/unknown entry paths
  # (`surface:unknown_owner`, `surface:bridge_error`, `skeleton:unclaimed`,
  # `skeleton:renderer_unavailable`, `effect:identity_unavailable`). The `unsupported` counter may
  # legitimately be 0 in a clean combat frame, so assert the KEY is present, not a positive count.
  - wait_probe:
      timeout_ms: 10000
      interval_ms: 250
      assert:
        path: backend.verify.backgroundOnly.unsupportedDistinct
        exists: true
  - wait_probe:
      timeout_ms: 10000
      interval_ms: 250
      assert:
        path: backend.verify.backgroundOnly.unsupportedByOwner
        exists: true
  # The blocked attribution must not come at the cost of the background: keep the draw guard.
  - wait_probe:
      timeout_ms: 10000
      interval_ms: 250
      assert:
        path: backend.verify.backgroundOnly.backgroundDraw
        gte: 1
  - screenshot: true
  - console: "art verify mode background-only off"
  - wait_probe:
      timeout_ms: 5000
      interval_ms: 250
      assert:
        path: backend.verify.backgroundOnly.active
        eq: false
