# Strict background-only probe. This is intentionally separate from native-isolate: it proves the
# deny-by-default gate and records the remaining unpatched native world as unsupported/uncovered.
name: d1_verify_background_only
schemaVersion: 1
mode: device
device: d1
require:
  env:
    - ART_D1_SERIAL
    - STS_CONNECTOR_PORT
    - SLAY_THE_AMETHYST_ROOT
steps:
  - console: "art verify mode background-only off"
  - console: "art verify mode background checker"
  - console: "art lab ensure-fresh-menu"
  - wait_probe:
      timeout_ms: 45000
      interval_ms: 500
      assert:
        path: lab.recipe.status
        eq: ok
  - console: "art lab start-run IRONCLAD"
  - wait_probe:
      timeout_ms: 45000
      interval_ms: 500
      assert:
        path: lab.recipe.status
        eq: ok
  - wait_probe:
      timeout_ms: 30000
      interval_ms: 500
      assert:
        path: lab.runReady
        eq: true
  - console: "art present combat on"
  - console: "fight Cultist"
  - wait_probe:
      timeout_ms: 30000
      interval_ms: 1000
      assert:
        path: projection.scene
        eq: combat
  - console: "art verify mode background-only on"
  - wait_probe:
      timeout_ms: 10000
      interval_ms: 250
      assert:
        path: backend.verify.backgroundOnly.active
        eq: true
  - wait_probe:
      timeout_ms: 10000
      interval_ms: 250
      assert:
        path: backend.verify.background.variant
        eq: checker
  - wait_probe:
      timeout_ms: 10000
      interval_ms: 250
      assert:
        path: backend.verify.backgroundOnly.backgroundDraw
        gte: 1
  - wait_probe:
      timeout_ms: 10000
      interval_ms: 250
      assert:
        path: backend.verify.backgroundOnly.backgroundSuppression
        gte: 1
  - wait_probe:
      timeout_ms: 10000
      interval_ms: 250
      assert:
        path: backend.verify.backgroundOnly.blockedForeground
        gte: 1
  # The current native world has unpatched creature/world entry points. Unsupported is required
  # evidence; this fixture must not claim a pure-background frame until it reaches zero.
  - wait_probe:
      timeout_ms: 10000
      interval_ms: 250
      assert:
        path: backend.verify.submissionStatus
        eq: unsupported
  - wait_probe:
      timeout_ms: 10000
      interval_ms: 250
      assert:
        path: backend.verify.backgroundOnly.uncovered
        gte: 1
  - screenshot: true
  - console: "art verify mode background-only off"
  - wait_probe:
      timeout_ms: 5000
      interval_ms: 250
      assert:
        path: backend.verify.backgroundOnly.active
        eq: false
