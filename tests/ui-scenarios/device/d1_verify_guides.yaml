# D1: ART-owned verification overlays. GUIDES/BOUNDS are drawn at VERIFY_GUIDES (rank 1000) and
# need no native boundary, so the host must report them ready while BACKGROUND stays unsupported.
name: d1_verify_guides
schemaVersion: 1
mode: device
device: d1
require:
  env:
    - ART_D1_SERIAL
    - STS_CONNECTOR_PORT
    - SLAY_THE_AMETHYST_ROOT
steps:
  - console: "art lab ensure-fresh-menu"
  - wait_probe:
      timeout_ms: 45000
      interval_ms: 500
      assert:
        path: lab.recipe.status
        eq: ok
  - console: "art lab start-run IRONCLAD"
  - wait_probe:
      timeout_ms: 45000
      interval_ms: 500
      assert:
        path: lab.recipe.status
        eq: ok
  - wait_probe:
      timeout_ms: 30000
      interval_ms: 500
      assert:
        path: lab.runReady
        eq: true
  - console: "art present combat on"
  - console: "fight Cultist"
  - wait_probe:
      timeout_ms: 30000
      interval_ms: 1000
      assert:
        path: projection.scene
        eq: combat
  - wait_probe:
      timeout_ms: 10000
      interval_ms: 500
      assert:
        path: backend.input.handState
        eq: FULL_READY
  # Default state: overlays off.
  - assert:
      path: backend.verify.configuredMode
      eq: "off"
  - assert:
      path: backend.verify.submissionStatus
      eq: disabled
  # Guides/bounds are ART-owned overlays: supported without a pre-native hook.
  - console: "art verify mode guides"
  - wait_probe:
      timeout_ms: 5000
      interval_ms: 250
      assert:
        path: backend.verify.configuredMode
        eq: guides
  - assert:
      path: backend.verify.submissionStatus
      eq: ready
  - assert:
      path: backend.verify.modeSupported
      eq: true
  - screenshot: true
  - console: "art verify mode bounds"
  - wait_probe:
      timeout_ms: 5000
      interval_ms: 250
      assert:
        path: backend.verify.configuredMode
        eq: bounds
  - assert:
      path: backend.verify.submissionStatus
      eq: ready
  - screenshot: true
  # Background still cannot claim pre-native pixels.
  - console: "art verify mode background"
  - wait_probe:
      timeout_ms: 5000
      interval_ms: 250
      assert:
        path: backend.verify.configuredMode
        eq: background
  - assert:
      path: backend.verify.submissionStatus
      eq: unsupported
  - assert:
      path: backend.verify.modeSupported
      eq: false
  # Returning to off must disable the overlays again.
  - console: "art verify mode off"
  - wait_probe:
      timeout_ms: 5000
      interval_ms: 250
      assert:
        path: backend.verify.configuredMode
        eq: "off"
  - assert:
      path: backend.verify.submissionStatus
      eq: disabled
  - screenshot: true
