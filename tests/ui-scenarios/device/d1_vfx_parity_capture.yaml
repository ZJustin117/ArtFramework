# D1 visual-sampling scenario: capture a NATIVE (claim-seam OFF) frame and, at the SAME encounter
# state, an ART (claim-seam ON) frame of the SAME spawned claimable kind, record the probe
# metadata, then REPEAT the gate-ON sample once more to show counter-level stability.
#
# WHAT IS SAMPLED
#   * NATIVE frame  — seam OFF; native draws the pixels. Expected: `aura.gate` false, spawn adds
#     ZERO ART `aura.draws` (native `aura.draws` is a lifetime-stable counter), and the native
#     decline/leak/mismatch ledgers stay flat.
#   * ART frame 1/2 — seam ON; ART owns the pixels of the spawned kind. Draw GROWTH is the proof and
#     the decline/mismatch/orphan ledgers stay flat in EACH sample.
#   The frame PNGs (one native + two ART) plus the probe JSON are the artifacts; the probe metadata
#   is captured around each frame for later independent human/visual review.
#
# HOW TO RETARGET: edit only the leading `set:` step. `target_kind` (e.g. `cardtrail`, `torchheadfire`,
# `absorption`) selects the claimable kind and `spawn_count` sets how many to spawn; every `${...}`
# reference below resolves from those variables. Change nothing else to retarget.
#
# WHY PIXEL PARITY IS NOT GATED: the live combat scene is NOT frame-frozen — enemy idle animation and
# ambient effects differ between captures — so pixel equality between the native and ART frames would
# flake. The frames are therefore saved for INDEPENDENT VISUAL REVIEW only; the gate asserts only
# robust counters. Repeatability is likewise asserted at COUNTER level (the two gate-ON samples each
# prove draw growth with flat ledgers), never by comparing the two ART PNGs pixel-for-pixel.
name: d1_vfx_parity_capture
schemaVersion: 1
mode: device
device: d1
require:
  env:
    - ART_D1_SERIAL
    - STS_CONNECTOR_PORT
    - SLAY_THE_AMETHYST_ROOT
steps:
  - set:
      target_kind: cardtrail
      spawn_count: 8
  # --- Standard run preamble (shape copied from d1_aura_claim.yaml): fresh menu -> run -> combat. ---
  - console: "art lab ensure-fresh-menu"
  - wait_probe:
      timeout_ms: 45000
      interval_ms: 500
      assert:
        path: lab.recipe.status
        eq: ok
  - console: "art lab start-run IRONCLAD"
  - wait_probe:
      timeout_ms: 45000
      interval_ms: 500
      assert:
        path: lab.recipe.status
        eq: ok
  - wait_probe:
      timeout_ms: 30000
      interval_ms: 500
      assert:
        path: lab.runReady
        eq: true
  - console: "fight Cultist"
  - wait_probe:
      timeout_ms: 30000
      interval_ms: 1000
      assert:
        path: lab.inCombat
        eq: true
  # --- NATIVE SAMPLE (seam OFF): capture the ART draw counter BEFORE the spawn, then prove the
  #     spawn added ZERO ART draws (a real fore/aft check; the OFF draw counter is lifetime-stable,
  #     so eq_var is sound here). `gate` must stay false and the native ledger must stay flat. ---
  - console: "art claim off"
  - console: "art claim clear"
  - wait_ms: 500
  - probe: all
  - capture:
      path: backend.renderPlan.aura.draws
      var: native_draws
  - capture:
      path: backend.renderPlan.nativeRender.declinedTotal
      var: native_declines
  - console: "art claim spawn ${target_kind} ${spawn_count}"
  - wait_ms: 300
  - probe: all
  - assert:
      path: backend.renderPlan.aura.draws
      eq_var: native_draws
  - assert:
      path: backend.renderPlan.nativeRender.declinedTotal
      eq_var: native_declines
  - capture:
      path: backend.renderPlan.aura.gate
      var: native_gate
  - assert:
      path: backend.renderPlan.aura.gate
      eq: false
  - screenshot: true
  # --- ART SAMPLE 1 (seam ON): capture the draw baseline and the ledger baselines right after
  #     `clear`, spawn the same kind, prove draw GROWTH (gt_var; the live scene also grows draws on
  #     its own, so GROWTH — not equality — is the sound proof), then assert the ledgers stayed FLAT. ---
  - console: "art claim on"
  - wait_probe:
      timeout_ms: 8000
      interval_ms: 200
      assert:
        path: backend.renderPlan.aura.ready
        gte: 1
  - console: "art claim clear"
  - probe: all
  - capture:
      path: backend.renderPlan.aura.draws
      var: art1_before
  - capture:
      path: backend.renderPlan.nativeRender.declinedTotal
      var: art1_declines_before
  - capture:
      path: backend.renderPlan.nativeRender.dispositionMismatch
      var: art1_mismatch_before
  - capture:
      path: backend.renderPlan.nativeRender.orphanArtOutput
      var: art1_orphans_before
  - console: "art claim spawn ${target_kind} ${spawn_count}"
  - wait_probe:
      timeout_ms: 8000
      interval_ms: 200
      assert:
        path: backend.renderPlan.aura.draws
        gt_var: art1_before
  - probe: all
  - screenshot: true
  - capture:
      path: backend.renderPlan.nativeRender.declinedTotal
      var: art1_declines
  - capture:
      path: backend.renderPlan.nativeRender.dispositionMismatch
      var: art1_mismatch
  - capture:
      path: backend.renderPlan.nativeRender.orphanArtOutput
      var: art1_orphans
  - assert:
      path: backend.renderPlan.nativeRender.declinedTotal
      eq_var: art1_declines_before
  - assert:
      path: backend.renderPlan.nativeRender.dispositionMismatch
      eq_var: art1_mismatch_before
  - assert:
      path: backend.renderPlan.nativeRender.orphanArtOutput
      eq_var: art1_orphans_before
  # --- ART SAMPLE 2 (repeatability, counter level): identical shape to sample 1 with fresh
  #     baselines. Draw growth + flat ledgers again prove the claimed kind renders reproducibly —
  #     no pixel comparison between the two ART frames. ---
  - console: "art claim clear"
  - probe: all
  - capture:
      path: backend.renderPlan.aura.draws
      var: art2_before
  - capture:
      path: backend.renderPlan.nativeRender.declinedTotal
      var: art2_declines_before
  - capture:
      path: backend.renderPlan.nativeRender.dispositionMismatch
      var: art2_mismatch_before
  - capture:
      path: backend.renderPlan.nativeRender.orphanArtOutput
      var: art2_orphans_before
  - console: "art claim spawn ${target_kind} ${spawn_count}"
  - wait_probe:
      timeout_ms: 8000
      interval_ms: 200
      assert:
        path: backend.renderPlan.aura.draws
        gt_var: art2_before
  - probe: all
  - screenshot: true
  - capture:
      path: backend.renderPlan.nativeRender.declinedTotal
      var: art2_declines
  - capture:
      path: backend.renderPlan.nativeRender.dispositionMismatch
      var: art2_mismatch
  - capture:
      path: backend.renderPlan.nativeRender.orphanArtOutput
      var: art2_orphans
  - assert:
      path: backend.renderPlan.nativeRender.declinedTotal
      eq_var: art2_declines_before
  - assert:
      path: backend.renderPlan.nativeRender.dispositionMismatch
      eq_var: art2_mismatch_before
  - assert:
      path: backend.renderPlan.nativeRender.orphanArtOutput
      eq_var: art2_orphans_before
  # --- STRICT acceptance must hold after both ART samples. ---
  - probe: all
  - assert:
      path: backend.renderPlan.nativeRenderStrict.accepted
      eq: true
  # --- FINISH: drop queued effects, return native pixels to authoritative, and confirm gate off. ---
  - console: "art claim clear"
  - console: "art claim off"
  - wait_probe:
      timeout_ms: 8000
      interval_ms: 200
      assert:
        path: backend.renderPlan.aura.gate
        eq: false
